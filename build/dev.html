  const s = MSTY[i];
  return [hsl(s[0], s[1], s[2]), hsl(s[0], s[3], s[4])];
}

function drawWorld() {
  const y0 = s2wy(0) - 200, y1 = s2wy(H) + 200;
  const wide = mx(2, (ST * 2 + 3) * SC), thin = lw(ST);
  const mass = hsl(pal[6] | 0, 30, mx(4, pal[2] * .42) | 0);
  for (const c of chunks) {
    if (c.y + c.h < y0 || c.y > y1) continue;
    // Rock beyond each wall, so the play column reads as a shaft.
    const ty = w2sy(c.y), by = w2sy(c.y + c.h);
    X.fillStyle = mass;
    for (const sd of [-9e3, 9e3]) {
      BP(); MT(sd, ty);
      LT(w2sx(sd < 0 ? c.pl : c.pr), ty);
      LT(w2sx(sd < 0 ? c.l : c.r), by);
      LT(sd, by); X.fill();
    }
    if (c.z) drawZone(c);
    for (const o of c.o) {
      if (o.k) continue;
      obT(o);
      const s2 = obStyle(o);
      const ox = w2sx(_cx), oy = w2sy(_cy);
      // Contact flash. Everything you touch swells and glows for a moment, so a
      // busy screen still reads as a chain of separate hits rather than a blur.
      const f = o.f > 0 ? (o.f = mx(0, o.f - .05)) : 0;
      // A lit fuse: the panel shudders and whitens in the instant before it goes.
      const fz = o.kt > 0 ? 1 : 0;
      if (f || fz) {
        X.save();
        X.translate(ox, oy); X.scale(1 + f * .3, 1 + f * .3); X.translate(-ox, -oy);
        if (fz) X.globalAlpha = .5 + rnd() * .5;
      }
      if (!o.t) {
        CIR(ox, oy, o.r * SC, s2[0], s2[1], lw((2.4 + f * 4)));
        if (o.m & M_BUMP) CIR(ox, oy, o.r * SC * .5, 0, s2[1], lw(1.6));
        if (f) CIR(ox, oy, (o.r + 6 + f * 20) * SC, 0, hsl(pal[6] + 30 | 0, 100, 80, f), lw(2));
      } else {
        const cg = cos(_cg) * o.r, sg2 = sin(_cg) * o.r;
        LIN(w2sx(_cx - cg), w2sy(_cy - sg2), w2sx(_cx + cg), w2sy(_cy + sg2), wide, s2[0]);
        SK(thin, s2[1]);
        if (o.m & M_BREAK) {
          X.setLineDash([6 * SC, 7 * SC]);
          SK(lw(2), hsl(48, 100, 80, .85));
          X.setLineDash([]);
        }
        if (f) SK(lw((2 + f * 5)), hsl(pal[6] + 30 | 0, 100, 90, f));
      }
      if (f || fz) { X.globalAlpha = 1; X.restore(); }
    }
    // Bank progress, floating above the middle of each partly-lit bank.
    for (const k of c.bk) if (k.l) {
      const bx = w2sx(k.x), by = w2sy(k.y) - 48 * SC;
      for (let i = 0; i < k.n; i++)
        CIR(bx + (i - (k.n - 1) / 2) * 13 * SC, by, 4 * SC,
          i < k.l ? hsl(48, 100, 68) : hsl(48, 30, 32));
    }
    for (const it of c.i) if (!it.g) drawItem(it);
  }
}

// A force field that cannot be seen is just the game cheating, so each one
// draws its own flow: rising streaks for an updraft, converging ones for a
// well, sideways drift for wind, upward fall for an inversion.
function drawZone(c) {
  const y0 = mx(c.y, s2wy(0) - 100), y1 = mn(c.y + c.h, s2wy(H) + 100), sp = y1 - y0;
  if (sp <= 0) return;
  const z = c.z;
  const hue = z == Z_UP ? 190 : z == Z_WELL ? 288 : z == Z_WIND ? 24
    : z == Z_INV ? 262 : z == Z_FLOW ? 150 : 186;
  const drift = T * (z == Z_WIND ? 60 : z == Z_RUSH ? 300 : 200) * (z == Z_UP || z == Z_INV ? -1 : 1);
  for (let i = 0; i < 26; i++) {
    const q = hsh(i * 13, c.y | 0);
    const x = lerp(c.l + 30, c.r - 30, hsh(i, 7));
    const yy = y0 + (((q * sp + drift) % sp) + sp) % sp;
    zoneF(c, x, yy);
    const m = hyp(_zx, _zy);
    if (m < 1) continue;
    const ln = mn(64, m * .05);
    LIN(w2sx(x), w2sy(yy), w2sx(x + _zx / m * ln), w2sy(yy + _zy / m * ln),
      lw(2.4), hsl(hue, 90, 70, .16 + q * .16));
  }
}

// Coins are circles; everything else is a spinning polygon with its own
// vertex count, radius and spin rate.
function drawItem(it) {
  const x = w2sx(it.x), y = w2sy(it.y), s = SC, b = 1 + sin(T * 3 + it.x * .02) * .12, t = it.t;
  if (!t) { CIR(x, y, 9 * s * b, UG, hsl(38, 100, 84), lw(2.4)); return; }
  if (t == I_WELL) {
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * TAU + T * .6;
      BP(); AR(x, y, 26 * s * b, a, a + .8);
      SK(7 * s, chsl(i, 60));
    }
    CIR(x, y, 13 * s * b, W9);
    return;
  }
  const cr = t == I_CROWN, pg = t == I_PIG;
  // Boosters wear the colour of the verb they amplify; White Efficiency is white.
  const bc = pg ? it.c : BOOST[it.c][0];
  const n = cr ? 10 : pg ? 6 : 3, rad = (cr ? 16 : pg ? 12 : 15) * s * b;
  X.save(); X.translate(x, y);
  X.rotate(T * (cr ? .8 : pg ? 1.4 : -1) + it.c);
  POLY(n, cr ? UG : pg ? chsl(bc, 60) : bc > 6 ? W9 : chsl(bc, 60),
    pg ? chsl(bc, 90) : W9, lw(2), (i) => {
      const a = i / n * TAU, q = rad * (cr && i & 1 ? .4 : 1);
      VTX(i, cos(a) * q, sin(a) * q);
    });
  X.restore();
}

// --- player strokes --------------------------------------------------------
// A fused stroke paints a gradient through every colour it carries - that
// gradient is the whole visual language of mixing.
function strokeColor(s, a) {
  const bits = [];
  for (let i = 0; i < 7; i++) if (s.e & CBIT[i]) bits.push(i);
  if (bits.length < 2) return chsl(bits[0] | 0, 60, a);
  const g = X.createLinearGradient(w2sx(s.x1), w2sy(s.y1), w2sx(s.x2), w2sy(s.y2));
  bits.forEach((b, i) => g.addColorStop(i / (bits.length - 1), chsl(b, 64, a)));
  return g;
}

function drawStrokes() {
  for (const s of strokes) {
    // A live stroke is permanent, so it is drawn at full strength. Only a spent
    // one fades, and that fade is the only thing that says it was consumed.
    const a = s.u ? clamp(s.l / SPENT, 0, 1) : 1;
    const x1 = w2sx(s.x1), y1 = w2sy(s.y1), x2 = w2sx(s.x2), y2 = w2sy(s.y2);
    // Four passes, because a drawing must never be mistakable for scenery: a
    // Green line in Cloudbreak sat at almost exactly the hue of that region's
    // bumpers. Glow, dark casing, colour, white core -- the casing and the core
    // are what separate the player's marks from the world at any palette.
    LIN(x1, y1, x2, y2, mx(4, 20 * SC), strokeColor(s, a * .16));
    SK(mx(3, (ST * 2 + 5) * SC), hsl(266, 55, 5, a * .8));
    SK(mx(2, ST * 2 * SC), strokeColor(s, a));
    SK(lw(ST * .8), hsl(0, 0, 100, a * .5));
    if (!s.u) {
      // The pin: where the drag began. Green hangs its rope here, so this ring
      // is not decoration -- it is the fact the tether rule depends on.
      CIR(x1, y1, (4.5 + sin(T * 4 + s.x1) * .8) * SC, 0, chsl(s.c, 80, .9), lw(2));
      // The aim: Orange fires you toward the far end, so the end gets an arrow.
      const dx = x2 - x1, dy = y2 - y1, L = hyp(dx, dy);
      if (L > 16) {
        const ux = dx / L, uy = dy / L, hd = 9 * SC;
        POLY(3, chsl(s.c, 70, .95), 0, 0, (i) => {
          const b = [0, 2.4, -2.4][i], cb = cos(b) * hd, sb = sin(b) * hd;
          VTX(i, x2 + cb * ux - sb * uy, y2 + sb * ux + cb * uy);
        });
      }
    }
    if (s == P.ra) {
      X.setLineDash([4 * SC, 9 * SC]); X.lineDashOffset = -T * 90 * SC;
      SK(lw(3), hsl(190, 100, 88, .9));
      X.setLineDash([]);
    }
  }
  for (const n of nodes) {
    const a = n.t / .5;
    CIR(w2sx(n.x), w2sy(n.y), (6 + (1 - a) * 26) * SC, 0, hsl(0, 0, 100, a), lw(3));
  }
  if (P.te) {
    const ax = w2sx(P.te.x), ay = w2sy(P.te.y);
    // The rope, plus the circle it may sweep. The radius is the length of the
    // line you drew, and seeing it is what turns the swing into something you
    // aim rather than something that happens to you.
    CIR(ax, ay, P.te.l * SC, 0, chsl(3, 60, .16), lw(1.4));
    LIN(ax, ay, w2sx(P.x), w2sy(P.y), lw(3.2), chsl(3, 70));
    CIR(ax, ay, 8 * SC, chsl(3, 60));
    CIR(ax, ay, (12 + sin(T * 9) * 3) * SC, 0, chsl(3, 80, .8), lw(2));
  }
}

function drawParts() {
  // Shockwaves sit under everything else so they read as pressure, not confetti.
  for (const w of shocks) {
    const a = clamp(w.t, 0, 1);
    CIR(w2sx(w.x), w2sy(w.y), w.r * SC, 0, hsl(w.h | 0, 100, 70, a * .7), lw(5 * a));
  }
  for (const p of parts) {
    const a = clamp(p.l / p.L, 0, 1), x = w2sx(p.x), y = w2sy(p.y);
    if (p.k == 4) {
      // Debris: a real spinning fragment of whatever just came apart.
      X.save(); X.translate(x, y); X.rotate(p.a);
      const q = p.s * SC * (.4 + a * .6);
      POLY(4, hsl(p.h | 0, 70, 40 + a * 26, a), hsl(p.h | 0, 90, 70, a), lw(1.2),
        (i) => VTX(i, [-1, .8, 1.2, -.6][i] * q, [-.7, -1.2, .9, 1][i] * q));
      X.restore();
      continue;
    }
    if (p.k == 2) CIR(x, y, (1 - a) * p.s * 9 * SC, 0, hsl(p.h | 0, 100, 70, a), lw(3 * a));
    else LIN(x, y, x - p.vx * (p.k ? .02 : .012) * SC, y - p.vy * (p.k ? .02 : .012) * SC,
      lw(p.s * (p.k ? 1 : a)), hsl(p.h | 0, p.k ? 70 : 100, p.k ? 60 : 60, a));
  }
  for (const p of pops) {
    const a = clamp(p.l, 0, 1);
    txt(p.t, w2sx(p.x), w2sy(p.y), 17 * SC / U,
      p.h < 0 ? hsl(0, 0, 100, a) : hsl(p.h | 0, 100, 70, a), 1);
  }
}

// --- the unicorn -----------------------------------------------------------
function pushTrail() {
  const n = trail.length ? trail[trail.length - 1] : 0;
  if (!n || hyp(P.x - n.x, P.y - n.y) > 7) {
    trail.push({ x: P.x, y: P.y, h: fullSpec > 0 ? -1 : HUE[sel] });
    while (trail.length > 26 + clamp(P.sp / 30, 0, 30)) trail.shift();
  }
}

function drawTrail() {
  const n = trail.length, style = WD ? SAVE.e[2] : 0;
  for (let i = 1; i < n; i++) {
    if (WD && style == 1 && i % 2) continue;
    const a = i / n, p = trail[i - 1], q = trail[i];
    LIN(w2sx(p.x), w2sy(p.y), w2sx(q.x), w2sy(q.y),
      mx(1, 15 * a * SC * (WD && style == 2 ? .6 + rnd() * .8 : 1)),
      hsl((q.h < 0 ? (T * 400 + i * 26) % 360 : q.h) | 0, 100, 60 + a * 18, a * .8));
  }
}

// The unicorn, drawn in local units under the current transform. Shared by
// gameplay and the store preview so there is exactly one unicorn in the game.
function unicornBody(body, tint, white, horn) {
  // Every alternative body, horn and trail is a store cosmetic, so each one
  // is behind WD and none of them exist in the competition build. What is
  // left is the unicorn everyone starts with, unchanged.
  const main = white ? W9 : WD && body == 1 ? hsl(268, 40, 12) : WD && body == 2 ? hsl(190, 100, 72) : hsl(300, 40, 96);
  const line = white ? chsl(flr(T * 6) % 7, 70) : WD && body == 2 ? hsl(300, 100, 70) : hsl(280, 45, 62);
  const gal = sin(T * 13), rb = flr(T * 5);

  BP(); MT(-13, 0);
  for (let i = 1; i < 5; i++) LT(-13 - i * 6, sin(T * 9 - i * .8) * (2 + i * 1.6));
  SK(5, chsl((rb + 2) % 7, 60));
  SK(2.4, chsl((rb + 5) % 7, 80));

  for (let i = 0; i < 4; i++) {
    const lx = -8 + (i >> 1) * 15, ph = gal * (i & 1 ? 1 : -1) * (i > 1 ? -1 : 1);
    BP(); MT(lx, 6); LT(lx + ph * 5, 15); LT(lx + ph * 8 + 2, 20);
    SK(3, main);
  }

  BP(); X.ellipse(0, 0, 17, 11, 0, 0, TAU);
  FL(main); SK(2, line);
  BP(); MT(8, -6);
  X.quadraticCurveTo(20, -14, 26, -12);
  X.quadraticCurveTo(30, -11, 30, -5);
  LT(20, -1); X.closePath();
  FL(main); SK(2, line);

  for (let i = 0; i < 4; i++) {
    BP(); MT(6 + i * 4, -7 - i);
    X.quadraticCurveTo(2 + i * 4, -16 - i * 1.6, 9 + i * 4, -18 - i);
    SK(3.2, chsl((rb + i) % 7, 60));
  }

  // Horn: 0 spiral, 1 long lance, 2 star tip. Purely decorative - the body is
  // a circle of radius R whatever is equipped.
  X.save(); X.translate(26, -12); X.rotate(-.6);
  const hl = WD && horn == 1 ? 26 : 15;
  const hg = X.createLinearGradient(0, 0, 0, -hl);
  hg.addColorStop(0, chsl(0, 60)); hg.addColorStop(1, chsl(tint, 90));
  POLY(3, hg, W9, 1.2, (i) => VTX(i, [-3, 3, 0][i], [0, 0, -hl][i]));
  if (!WD || !horn) for (let i = 0; i < 4; i++) {
    const q = i / 4;
    LIN(-3 + q * 6 * .5, -hl * q, 3 - q * 6 * .5, -hl * q - 2, 1.2, chsl((rb + i) % 7, 90));
  }
  if (WD && horn == 2) POLY(10, W9, chsl(tint, 90), 1, (i) => {
    const a = i / 10 * TAU + T * 2, q = (i & 1 ? 2.4 : 6);
    VTX(i, cos(a) * q, -hl + sin(a) * q);
  });
  X.restore();

  CIR(26, -8, 1.6, st == 1 && P.st > STALLW ? '#f44' : hsl(276, 38, 15));
}

function drawUnicorn() {
  const s = SC, x = w2sx(P.x), y = w2sy(P.y);
  X.save();
  X.translate(x, y); X.rotate(P.a); X.scale(s, s);
  unicornBody(WD ? SAVE.e[0] : 0, sel, fullSpec > 0 || P.ph > 0, WD ? SAVE.e[1] : 0);
  X.restore();

  // Selected-colour halo, tinted red while Red-charged: world-space feedback
  // so the player never has to glance at the HUD.
  CIR(x, y, (R + 7) * s, 0, P.rp > 0 ? hsl(6, 100, 62) : chsl(sel, 70, .5), lw((P.rp > 0 ? 3 : 2)));
  if (P.st > STALLW) {
    const u = (P.st - STALLW) / (STALLT - STALLW);
    BP(); AR(x, y, (R + 16 + sin(T * 20) * 4) * s, -PI / 2, -PI / 2 + TAU * (1 - u));
    SK(mx(2, 4 * s), hsl(30 - u * 30, 100, 60));
  }
}

// ==== hud.js ====
// ---------------------------------------------------------------------------
// HUD, prism selector, menus, results and the cosmetic store.
// All immediate-mode on the same canvas - no DOM.
//
// The UI deliberately reuses a tiny fixed palette and a single modal helper:
// every distinct colour string and layout number costs compressed bytes.
// ---------------------------------------------------------------------------

// Four cosmetic categories of three variants; variant 0 is always owned.
// Cosmetics are render-only: they never touch collision, pigment or scoring.
// Gated at the declaration, not just at its uses. Terser drops an unreferenced
// const only when it can prove the initialiser is side-effect free, and it will
// not assume that of `.split(' ')` -- so this table survived into the
// competition build after everything that reads it had already gone.
const COSN = WD && ('CLOUD SHADOW NEON SPIRAL LANCE STARTIP ' +
  'RAINBOW DASHED COMET SPARKS SHARDS RINGS').split(' ');
const COSP = [0, 180, 420];
const CATS = 4;
const owned = (c, i) => !i || (SAVE.o >> (c * 3 + i)) & 1;

// fixed UI palette
const W9 = hsl(0, 0, 100);
const W6 = hsl(0, 0, 100, .62);
const W3 = hsl(0, 0, 100, .34);
const UB = hsl(282, 40, 15, .88);   // button
const UE = hsl(290, 55, 50);         // edge / accent
const UG = hsl(48, 100, 66);         // gold

let U = 1;              // UI scale
let btns = [];          // immediate-mode buttons for this frame

// Centred and bold is by far the commonest case, so it is the default and the
// alignment argument comes last.
function txt(s, x, y, sz, col, bold, al) {
  X.font = (bold ? 'bold ' : '') + (sz * U | 0) + 'px monospace';
  X.textAlign = al || 'center';
  X.fillStyle = col;
  X.fillText(s, x, y);
}
const RR = (x, y, w, h, r) => { BP(); X.roundRect(x, y, w, h, r); };
const hot = (x, y, w, h) => pmx > x - w / 2 && pmx < x + w / 2 && pmy > y - h / 2 && pmy < y + h / 2;

function btn(x, y, w, h, label, fn, accent) {
  const o = hot(x, y, w, h);
  btns.push({ x, y, w, h, fn });
  RR(x - w / 2, y - h / 2, w, h, 8 * U);
  FL(o ? accent || UE : UB);
  SK(2 * U, o ? W9 : UE);
  txt(label, x, y + U, 15, o ? W9 : W6, 1);
}

// Hit-test at click time, not at draw time. Caching each button's hover state
// during draw meant a press at a position the pointer had not already been
// hovering was tested against the *previous* frame's cursor and silently did
// nothing -- fine for a mouse that drifts to the button first, broken for a
// tap and for anything that clicks straight to a coordinate.
function uiClick() {
  for (const b of btns) if (hot(b.x, b.y, b.w, b.h)) { sndUI(1); b.fn(); return 1; }
  return 0;
}

// --- in-run HUD ------------------------------------------------------------
function hud() {
  const p = 30 * U, bw = 240 * U, dep = mx(P.y, 0);
  CIR(p, p, 9 * U, UG);
  // Coins stay as in-run reward feedback in both builds; only the banked
  // total beside them is a store thing.
  txt(coins + (WD && SAVE.c ? ' (' + (SAVE.c + coins) + ')' : ''), p + 16 * U, p, 16, UG, 1, 'left');
  txt(score | 0, W - p, p, 19, W9, 1, 'right');
  if (mult > 1.05) txt('x' + mult.toFixed(1), W - p, p + 22 * U, 15, chsl(2, 70), 1, 'right');
  if (combo > 3) {
    const k = 1 + mn(combo, 30) * .02, cc = clamp(comboT / 1.6, 0, 1);
    txt(combo + ' CHAIN', W - p, p + 46 * U, 15 * k, hsl(48, 100, 60 + combo, cc), 1, 'right');
  }

  // region name, progress bar and depth
  X.fillStyle = W3;
  X.fillRect(W / 2 - bw / 2, p + 12 * U, bw, 4 * U);
  X.fillStyle = hsl(pal[6] | 0, 90, 70);
  X.fillRect(W / 2 - bw / 2, p + 12 * U, bw * clamp((dep % REGD) / REGD, 0, 1), 4 * U);
  txt(REG[reg][0] + (loopAt(P.y) ? ' +' + loopAt(P.y) : ''), W / 2, 18 * U, 14, W6, 1);
  txt((dep / 10 | 0) + 'm', W / 2 + bw / 2 + 24 * U, p + 14 * U, 13, W3, 0, 'left');

  prismBar();

  let brow = 0;
  for (let i = 0; i < 7; i++) if (boostT[i] > 0)
    txt(BNAME[i] + ' ' + boostT[i].toFixed(1), W - p, p + (30 + brow++ * 16) * U, 12,
      BOOST[i][0] > 6 ? W9 : chsl(BOOST[i][0], 70), 1, 'right');
  if (regShow > 0)
    txt(REG[reg][0], W / 2, H * .3, 42,
      hsl(0, 0, 100, clamp(regShow, 0, 1) * clamp(3.2 - regShow, 0, 1)), 1);
  // The in-run hints are gone from the 13K build. The title screen teaches the
  // same three things -- drag to draw, the colour keys, pigment is finite --
  // and it teaches them before the first frame instead of during it.
}

// Seven reservoirs: fill = pigment left, ring = selection, dot = chain state.
// The segments are clickable, so the game is playable with the mouse alone.
function prismBar() {
  const w = 44 * U, x0 = W / 2 - 25 * w / 7, y = H - 40 * U, h = 26 * U;
  for (let i = 0; i < 7; i++) {
    const x = x0 + i * w * 50 / 44, on = i == sel, f = pig[i] / PMAX, cx = x + w / 2;
    RR(x, y - h / 2, w, h, 5 * U);
    FL(hsl(270, 30, 8, .8));
    X.save(); X.clip();
    X.fillStyle = chsl(i, on ? 60 : 42, dryC == i && dryT > 0 ? .4 + sin(T * 40) * .3 : 1);
    X.fillRect(x, y + h / 2 - h * f, w, h * f);
    X.restore();
    RR(x, y - h / 2, w, h, 5 * U);
    SK((on ? 2.6 : 1.2) * U, on ? W9 : chsl(i, 55, .8));
    txt('ROYGBIV'[i], cx, y, on ? 15 : 12, on ? W9 : W6, 1);
    txt(i + 1, cx, y - h / 2 - 9 * U, 10, on ? W9 : W3);
    if (chain & CBIT[i]) CIR(cx, y + h / 2 + 8 * U, 2.6 * U, chsl(i, 75));
    btns.push({ x: cx, y, w, h, fn: () => setSel(i) });
  }
  if (chainN > 2) txt(chainN + '/7', x0 - 18 * U, y, 13, W9, 1);
}

// The reach ring: strokes may only start within SREACH of the unicorn, and
// further clicks clamp back onto that circle. Showing the clamp point is the
// one piece of pointer feedback that is about the rules rather than decoration,
// so it survives while the drawn cursor does not.
function cursor() {
  if (st != 1 || drawing || !P.al) return;
  const dx = mwx - P.x, dy = mwy - P.y, d = hyp(dx, dy);
  if (d > SREACH) CIR(w2sx(P.x + dx / d * SREACH), w2sy(P.y + dy / d * SREACH), 4 * U, chsl(sel, 60, .8));
}

// --- modal framework -------------------------------------------------------
// bs = [dx, dy, w, label, fn, accent] offsets from the screen centre.
function modal(w, h, title, lines, bs, sz) {
  X.fillStyle = hsl(275, 45, 5, .8);
  X.fillRect(0, 0, W, H);
  if (w) {
    RR(W / 2 - w * U / 2, H / 2 - h * U / 2, w * U, h * U, 14 * U);
    FL(hsl(272, 40, 9, .96));
    SK(2 * U, UE);
    txt(title, W / 2, H / 2 - (h / 2 - 34) * U, 27, W9, 1);
  }
  for (let i = 0; i < lines.length; i++)
    txt(lines[i], W / 2, H / 2 - (h / 2 - 78) * U + i * 22 * U, sz || 13.5, W6, sz ? 1 : 0);
  for (const b of bs) btn(W / 2 + b[0] * U, H / 2 + b[1] * U, b[2] * U, 40 * U, b[3], b[4], b[5]);
}

const back = () => { st = SAVE.b || score ? 3 : 0; };
function mute() { SAVE.m ^= 1; if (mg) mg.gain.value = SAVE.m ? 0 : .8; save(); }

function screenTitle() {
  // With no store to sit beside it, MUTE takes the middle of the second row.
  const bs = [[0, -30, 190, 'PLAY', startRun, hsl(300, 80, 55)],
    [WD ? 105 : 0, 26, 130, SAVE.m ? 'UNMUTE' : 'MUTE', mute]];
  if (WD) bs.push([-105, 26, 130, 'STORE', () => { st = 4; }]);
  modal(0, 0, 0, [], bs);
  const cy = H * .3;
  // Seven drifting colour ghosts behind one white title. This used to set the
  // font, the alignment and the fill by hand every pass, which is precisely
  // what txt() already does.
  for (let i = 0; i < 7; i++)
    txt('PRISMFALL', W / 2 + sin(T * 1.2 + i * .5) * 5 * U, cy + (i - 3) * 2.4 * U, 66, chsl(i, 60, .5), 1);
  txt('PRISMFALL', W / 2, cy, 66, W9, 1);
  txt('you never steer the unicorn - you draw the physics', W / 2, cy + 46 * U, 15, W6);
  [
    'DRAG near the unicorn - drawings STAY until used - longer = stronger',
    'R push - O aim - Y spring - G tether - B rail - I gravity - V warp',
    0,   // the mixing line, painted below through the whole spectrum
    // Back to the full line now that the in-run hints are gone: this is the
    // only place left that teaches either half of it.
    'X lets go - 1-7 or SCROLL picks a colour',
  ].forEach((l, i) => l && txt(l, W / 2, H - 122 * U + i * 19 * U, 13,
    i == 1 ? W6 : i > 2 ? W3 : W9, !i));
  // Mixing is the deepest rule in the game -- two crossing strokes fuse and the
  // line then does both colours at once -- and it was nowhere on this screen.
  // It gets its own line, drawn through all seven hues, so the sentence
  // demonstrates the thing it is describing.
  const mix = X.createLinearGradient(W / 2 - 300 * U, 0, W / 2 + 300 * U, 0);
  for (let i = 0; i < 7; i++) mix.addColorStop(i / 6, chsl(i, 68));
  txt('CROSS TWO STROKES TO MIX THEM - O+Y aims AND springs', W / 2, H - 84 * U, 13, mix, 1);
  if (WD) wdIdentity(W / 2, H * .3 - 74 * U), wdBoard(W - 190 * U, H / 2 - 40 * U);
  // Below the buttons, not at a fixed offset from the title: at 16:9 heights
  // the old position landed straight on top of PLAY.
  if (SAVE.b) txt('BEST ' + SAVE.b + '   DEPTH ' + (SAVE.d / 10 | 0) + 'm' + (WD ? '   COINS ' + SAVE.c : ''),
    W / 2, H / 2 + 82 * U, 14, W3);
}

function screenResults() {
  modal(470, 330, 'RUN OVER', [
    'SCORE   ' + (score | 0),
    'DEPTH   ' + (depth / 10 | 0) + 'm',
    'REGION  ' + REG[reg][0],
    'COINS   +' + coins,
    'BEST    ' + SAVE.b,
    score >= SAVE.b && score ? 'NEW BEST!' : '',
  ], WD ? [
    [0, 62, 210, 'RETRY  (R)', startRun, hsl(300, 80, 55)],
    [-105, 114, 130, 'STORE', () => { st = 4; }],
    [105, 114, 130, 'MENU', () => { st = 0; }],
  ] : [
    [0, 62, 210, 'RETRY  (R)', startRun, hsl(300, 80, 55)],
    [0, 114, 130, 'MENU', () => { st = 0; }],
  ], 16);
}

function screenPause() {
  modal(340, 296, 'PAUSED', [], [
    [0, -40, 200, 'RESUME', () => { st = 1; }],
    [0, 8, 200, 'RESTART  (R)', startRun],
    [0, 56, 200, SAVE.m ? 'UNMUTE' : 'MUTE', mute],
    [0, 104, 200, 'QUIT RUN', () => { endRun(); st = 3; }],
  ]);
}

// --- store -----------------------------------------------------------------
let prevCat = -1, prevIt = -1;
function screenStore() {

    if (o) { prevCat = c; prevIt = i; }
    RR(x, y - 19 * U, 140 * U, 38 * U, 7 * U);
    FL(eq ? UE : own ? UB : hsl(275, 25, 10));
    SK((eq ? 2.4 : 1) * U, eq || o ? W9 : W3);
    txt(COSN[n], x + 66 * U, y - 5 * U, 11, own ? W9 : W6, 1);
    txt(own ? (eq ? 'EQUIPPED' : 'EQUIP') : COSP[i] + 'c', x + 66 * U, y + 9 * U, 10,
      own ? W3 : SAVE.c < COSP[i] ? hsl(0, 60, 60) : UG);
    btns.push({ x: x + 66 * U, y, w: 140 * U, h: 38 * U, fn: () => buyEquip(c, i) });

function buyEquip(c, i) {
  if (owned(c, i)) { SAVE.e[c] = i; save(); return; }
  if (SAVE.c >= COSP[i]) {
    SAVE.c -= COSP[i];
    SAVE.o |= 1 << (c * 3 + i);
    SAVE.e[c] = i;
    save(); sndPower();
  } else sndEmpty();
}

// ==== game.js ====
// ---------------------------------------------------------------------------
// Game flow: persistence, run lifecycle, per-frame update and the main loop.
// ---------------------------------------------------------------------------

let acc = 0, last = 0, deadT = 0, stallSnd = 0;
const HSTEP = 1 / 120;

// --- persistence -----------------------------------------------------------
// One namespaced key, comma separated, clamped on read. Never clears storage.
// The four fields both builds need come first, so the competition build reads
// and writes a four-field record and the Wavedash build appends the store's
// six on the end. A record from either build loads in either build.
function load() {
  try {
    const a = (localStorage[LS] || '').split(',').map(Number);
    if (a.length < 3 || a.some(isNaN)) return;
    SAVE.b = clamp(a[0] | 0, 0, 1e12);
    SAVE.d = clamp(a[1] | 0, 0, 1e12);
    SAVE.m = a[2] ? 1 : 0;
    if (WD && a.length > 8) {
      SAVE.c = clamp(a[3] | 0, 0, 1e9);
      SAVE.o = a[4] | 0;
      for (let i = 0; i < CATS; i++) {
        const v = a[5 + i] | 0;
        SAVE.e[i] = v > 0 && v < 3 && owned(i, v) ? v : 0;
      }
    }
  } catch (err) { /* storage unavailable - play anyway */ }
}
function save() {
  try {
    const a = [SAVE.b, SAVE.d, SAVE.m];
    if (WD) a.push(SAVE.c, SAVE.o, ...SAVE.e);
    localStorage[LS] = a.join();
  } catch (err) { /* ignore */ }
}

// --- run lifecycle ---------------------------------------------------------
function startRun(sd) {
  audioInit();
  st = 1; score = 0; coins = 0; mult = 1; depth = 0; reg = 0; regShow = 3.2;
  chain = 0; chainN = 0; chainT = 0; fullSpec = 0; combo = 0; comboT = 0;
  deadT = 0; shake = 0; flash = 0; hstop = 0;
  pig = [PMAX, PMAX, PMAX, PMAX, PMAX, PMAX, PMAX];
  boostT = [0, 0, 0, 0, 0, 0, 0];
  strokes = []; parts = []; trail = []; pops = []; nodes = []; shocks = [];
  drawing = null;
  P.x = 0; P.y = -320; P.vy = 300; P.a = PI / 2;
  P.ra = null; P.te = null; P.ph = 0; P.rp = 0; P.st = 0; P.gt = 0; P.al = 1; P.sp = 300; P.rw = 0;
  Gx = 0; Gy = GRAV;
  C.x = P.x; C.y = P.y; C.z = 1;
  pal = regPal(0);
  worldReset(sd);
  // After the seed is set, never before: otherwise the opening drift is drawn
  // from whatever PRNG state the previous run happened to leave behind and a
  // seeded replay is not actually reproducible.
  P.vx = rf(-70, 70);
  mStep = 0; if (AC) mNext = AC.currentTime + .05;
  sndRail(0);
}

function endRun() {
  if (WD) SAVE.c += coins;
  SAVE.b = mx(SAVE.b, score | 0);
  SAVE.d = mx(SAVE.d, depth | 0);
  save();
  sndRail(0);
  if (WD) wdSubmit(score | 0, depth | 0);
}

function die() {
  P.al = 0; deadT = 1.3;
  for (let i = 0; i < 7; i++) burst(P.x, P.y, 16, 0, 520, HUE[i]);
  pt(P.x, P.y, 0, 0, .7, -1, 2, 22);
  shake = 30; flash = .7; flashH = -1;
  sndDeath();
  if (P.ra) detachRail(0);
  if (P.te) releaseTether();
  if (st != 0) endRun();
}

// --- per-frame -------------------------------------------------------------
function update(dt) {
  worldUpdate();

  if (P.al) physicsFrame(dt);

  fuseStep(dt);

  // Past the Rainbow Engine the shaft simply begins again, harder: regAt wraps
  // and difAt keeps climbing with the loop count, so the cycle boundary needs no
  // code of its own. It still announces itself, because a loop boundary is also
  // a region change and those already flash, name themselves and sound a gate.

  // region progression
  const r = regAt(P.y);
  if (r != reg) {
    reg = r; regShow = 3.2;
    flash = mx(flash, .35); flashH = REG[reg][1];
    sndGate();
    score += 500 * mult | 0;
  }

  // score + multiplier
  if (P.y > depth) { score += (P.y - depth) * .05 * mult; depth = P.y; }
  mult = clamp(1 + P.sp / 950 + chainN * .2 + (fullSpec > 0 ? 2 : 0), 1, 12);

  // Stall is the only failure state: too slow for too long and the run ends.
  if (P.al) {
    const stallT = STALLT;
    if (P.sp < STALLV) {
      P.st += dt;
      const u = clamp((P.st - STALLW) / (stallT - STALLW), 0, 1);
      if ((stallSnd -= dt) <= 0 && u > 0) { stallSnd = mx(.16, .55 - u * .4); sndStall(u); }
      if (P.st > stallT) die();
    } else if (P.st > 0) {
      if (P.st > STALLW) burst(P.x, P.y, 8, 0, 260, HUE[0]);
      P.st = mx(0, P.st - dt * 2.6);
    }
  } else {
    deadT -= dt;
    if (deadT <= 0) { if (st == 0) { startRun(); st = 0; } else st = 3; }
  }

  // timers
  regShow -= dt; dryT -= dt; fullSpec -= dt;
  for (let i = 0; i < 7; i++) boostT[i] -= dt;
  if (comboT > 0 && (comboT -= dt) <= 0) combo = 0;
  if (chainT > 0 && (chainT -= dt) <= 0) { chain = 0; chainN = 0; }
  flash = mx(0, flash - dt * 2.4);

  // Strokes are permanent. Only a *spent* one runs a timer, and that timer is
  // purely the fade that shows it was consumed. The single other way a drawing
  // leaves the field is scrolling out of reach behind you, which the player
  // never sees happen.
  for (let i = strokes.length; i--;) {
    const s = strokes[i];
    if (s.u) s.l -= dt;
    if ((s.u && s.l <= 0) || s.y2 < P.y - 2600) {
      if (P.ra == s) detachRail(1);
      if (s == drawing) drawing = null;
      strokes.splice(i, 1);
    }
  }

  partStep(dt);
  if (P.al) pushTrail();
}

function physicsFrame(dt) {
  acc += dt;
  let n = 0;
  while (acc >= HSTEP && n < 8) { physics(HSTEP); acc -= HSTEP; n++; }
  if (n >= 8) acc = 0;
}

// --- draw ------------------------------------------------------------------
function draw() {
  btns = [];
  U = mn(W / 1280, H / 720);
  background();
  drawWorld();
  drawStrokes();
  drawTrail();
  drawParts();
  if (P.al) drawUnicorn();
  if (st == 1 || st == 2) hud();
  if (flash > .01) {
    X.fillStyle = flashH < 0
      ? hsl((T * 500) % 360 | 0, 100, 75, flash * .5)
      : hsl(flashH | 0, 100, 72, flash * .45);
    X.fillRect(0, 0, W, H);
  }
  // WD && screenStore folds to 0 in the competition build, which is what
  // drops the store screen, buyEquip and the cosmetic tables entirely.
  if (st > 1) [0, 0, screenPause, screenResults, WD && screenStore][st]();
  else if (!st) screenTitle();
  cursor();
  if (DEBUG) {
    txt('seed ' + seed + '  v ' + (P.sp | 0) + '  chunks ' + chunks.length + '  parts ' + parts.length +
      '  reg ' + reg + '  st ' + P.st.toFixed(1), 8, H - 10, 12, '#0f0', 0, 'left');
  }
}

// --- main loop -------------------------------------------------------------
function frame(ts) {
  requestAnimationFrame(frame);
  const raw = clamp((ts - last) / 1000, 0, .05);
  last = ts;
  // Hit-stop: a shatter or a hard bumper freezes the simulation for a few
  // frames while the particles keep moving. It costs four lines and it is the
  // single largest contributor to a hit feeling like it landed.
  let dt = raw;
  if (hstop > 0) { hstop -= raw; dt *= .12; }
  T += dt;
  if (st == 1 || st == 0) update(dt);
  else if (st == 3) partStep(dt);
  camUpdate(raw);
  palUpdate(raw);
  audioFrame();
  draw();
}

// --- boot ------------------------------------------------------------------
load();
resize();
// The title screen shows a live world behind it.
startRun();
st = 0;
P.al = 1;
requestAnimationFrame(frame);

// ==== input.js ====
// ---------------------------------------------------------------------------
// Input: pointer drawing, colour selection (keys 1-7, scroll, prism bar),
// pause/restart/mute.
// ---------------------------------------------------------------------------

// Colour selection is instant and free; only drawing costs pigment.
function setSel(i) {
  i = (i + 7) % 7;
  if (i == sel) return;
  sel = i;
  sndUI(1);
  burst(P.x, P.y, 6, 0, 130, HUE[i]);
}

document.body.style.cssText = 'margin:0;overflow:hidden';
CV.style.cssText = 'position:fixed;width:100%;height:100%';

function resize() {
  const d = mn(devicePixelRatio, 2);
  W = CV.width = innerWidth * d | 0;
  H = CV.height = innerHeight * d | 0;
  // Sizing the canvas resets its context, so the two settings that never
  // change are restored here rather than before every stroke and every string.
  X.lineCap = 'round';
  X.textBaseline = 'middle';
}

function ptr(e) {
  const d = W / innerWidth;
  pmx = e.clientX * d; pmy = e.clientY * d;
  mwx = s2wx(pmx); mwy = s2wy(pmy);
}

addEventListener('resize', resize);

addEventListener('pointermove', (e) => { ptr(e); if (drawing) moveStroke(); });

addEventListener('pointerdown', (e) => {

addEventListener('keydown', (e) => {
  audioInit();
  const k = e.key, l = k.toLowerCase();
  if (k > '0' && k < '8') { setSel(+k - 1); return; }
  if (k == 'Escape' || l == 'p') st = st == 1 ? 2 : st == 2 ? 1 : WD && st == 4 ? (back(), st) : st;
  if (l == 'r' && st > 1) startRun();
  if (l == 'm') mute();
  // Let go of whatever is holding you. With permanent strokes a rail lasts as
  // long as its line does, so there has to be a way off it that is not a crash.
  if (l == 'x') { if (P.ra) detachRail(1); else if (P.te) releaseTether(); }
  if (k == ' ' || k == 'Enter') { if (st == 2) st = 1; else if (st < 4) startRun(); }
  if (DEBUG) {
    if (k == 'g') { jumpReg(regAt(P.y) + 1); }
    if (k == 'f') for (let i = 0; i < 7; i++) pig[i] = PMAX;
  }
});
// Absolute region jump, exposed for the screenshot gallery so a capture always
// lands in the region it claims to be capturing. DEBUG-only: Terser drops the

if (DEBUG) window.jumpReg = (r) => {
  P.y = r * REGD + 600; P.x = 0; P.vx = 0; P.vy = 500;
  P.ra = null; P.te = null; P.st = 0; P.al = 1;
  reg = regAt(P.y); pal = regPal(reg);
  chunks = []; nextY = P.y - 900; prevL = -COL; prevR = COL;
  while (nextY < P.y + 3200) genChunk();
};
// A couple more DEBUG-only probes for the live feel harness, which needs to
// reach inside the IIFE to light a target or sample speed over time.
if (DEBUG) {
  window.__chunks = () => chunks;
  window.__light = (o) => light(o, o.x, o.y);
  window.__te = () => (P.te ? { l: P.te.l, t: P.te.t } : null);
  window.__pos = () => [w2sx(P.x), w2sy(P.y)];
  window.__speeds = () => ({ sp: P.sp | 0, mult: +mult.toFixed(1), combo, score: score | 0, strokes: strokes.length });
}
document.addEventListener('visibilitychange', () => { if (document.hidden && st == 1) st = 2; });
