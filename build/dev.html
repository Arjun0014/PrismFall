// --- store -----------------------------------------------------------------
let prevCat = -1, prevIt = -1;
function screenStore() {
  modal(560, 470, 'PRISM STORE', [SAVE.c + ' COINS  ·  cosmetics only, never power'],
    [[0, 198, 150, 'BACK', back]], 14);
  prevCat = -1;
  const x0 = W / 2 - 240 * U;
  for (let n = 0; n < CATS * 3; n++) {
    const c = n / 3 | 0, i = n % 3;
    const x = x0 + i * 150 * U, y = H / 2 - 118 * U + c * 48 * U;
    const own = owned(c, i), eq = SAVE.e[c] === i, o = hot(x + 66 * U, y, 140 * U, 38 * U);
    if (o) { prevCat = c; prevIt = i; }
    RR(x, y - 19 * U, 140 * U, 38 * U, 7 * U);
    FL(eq ? UE : own ? UB : 'hsl(275 25% 10%)');
    SK((eq ? 2.4 : 1) * U, eq || o ? W9 : W3);
    txt(COSN[n], x + 66 * U, y - 5 * U, 11, own ? W9 : W6, 'center', 1);
    txt(own ? (eq ? 'EQUIPPED' : 'EQUIP') : COSP[i] + 'c', x + 66 * U, y + 9 * U, 10,
      own ? W3 : SAVE.c < COSP[i] ? 'hsl(0 60% 60%)' : UG);
    btns.push({ hot: o, fn: () => buyEquip(c, i) });
  }
  // Live preview through the real unicorn renderer.
  X.save();
  X.translate(W / 2, H / 2 + 130 * U);
  X.scale(2.2 * U, 2.2 * U);
  // Preview the hovered variant in place, everything else as equipped.
  unicornBody(prevCat === 0 ? prevIt : SAVE.e[0], flr(T * 3) % 7, 0,
    prevCat === 1 ? prevIt : SAVE.e[1]);
  X.restore();
}

function buyEquip(c, i) {
  if (owned(c, i)) { SAVE.e[c] = i; save(); return; }
  if (SAVE.c >= COSP[i]) {
    SAVE.c -= COSP[i];
    SAVE.o |= 1 << (c * 3 + i);
    SAVE.e[c] = i;
    save(); sndPower();
  } else sndEmpty();
}

// ==== 85_input.js ====
// ---------------------------------------------------------------------------
// Input: pointer drawing, colour selection (keys 1-7, wheel, HUD, radial),
// pause/restart/mute.

// Colour selection is instant and free; only drawing costs pigment.
function setSel(i) {
  i = (i + 7) % 7;
  if (i === sel) return;
  sel = i;
  sndUI(1);
  burst(P.x, P.y, 6, 0, 130, HUE[i]);
  if (hint === 1) { hint = 2; hintT = 0; }
}

document.body.style.cssText = 'margin:0;overflow:hidden;background:#05030c';
CV.style.cssText = 'position:fixed;width:100%;height:100%;cursor:none';

function resize() {
  const d = mn(devicePixelRatio || 1, 2);
  W = CV.width = innerWidth * d | 0;
  H = CV.height = innerHeight * d | 0;
  U = mn(W / 1280, H / 720);
}

function ptr(e) {
  const d = W / innerWidth;
  pmx = e.clientX * d; pmy = e.clientY * d;
  mwx = s2wx(pmx); mwy = s2wy(pmy);
}

  if (e.button === 2) { if (st === 1) { wheel = [pmx, pmy]; wsel = sel; } return; }
  if (e.button) return;

});

});

  if (st !== 1) return;
  e.preventDefault();
  setSel(sel + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });

addEventListener('keydown', (e) => {
  audioInit();
  const k = e.key, l = k.toLowerCase();
  if (k > '0' && k < '8') { setSel(+k - 1); return; }
  if (k === 'Escape' || l === 'p') st = st === 1 ? 2 : st === 2 ? 1 : st === 4 ? (back(), st) : st;
  if (l === 'r' && st > 1) startRun();
  if (l === 'm') mute();
  if (k === ' ' || k === 'Enter') { if (st === 2) st = 1; else if (st < 4) startRun(); }
  if (DEBUG) {
    if (k === 'g') { P.y += REGD; P.vy = 400; }
    if (k === 'f') for (let i = 0; i < 7; i++) pig[i] = PMAX;
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && st === 1) st = 2; });

// ==== 90_game.js ====
// ---------------------------------------------------------------------------
// Game flow: persistence, run lifecycle, per-frame update and the main loop.
// ---------------------------------------------------------------------------

let acc = 0, last = 0, deadT = 0, stallSnd = 0;
const HSTEP = 1 / 120;

// --- persistence -----------------------------------------------------------
// One namespaced key, comma separated, clamped on read. Never clears storage.
function load() {
  try {
    const a = (localStorage[LS] || '').split(',').map(Number);
    if (a.length < 9 || a.some(isNaN)) return;
    SAVE.c = clamp(a[0] | 0, 0, 1e9);
    SAVE.b = clamp(a[1] | 0, 0, 1e12);
    SAVE.d = clamp(a[2] | 0, 0, 1e12);
    SAVE.o = a[3] | 0;
    SAVE.m = a[4] ? 1 : 0;
    SAVE.t = a[5] ? 1 : 0;
    for (let i = 0; i < CATS; i++) {
      const v = a[6 + i] | 0;
      SAVE.e[i] = v > 0 && v < 3 && owned(i, v) ? v : 0;
    }
  } catch (err) { /* storage unavailable — play anyway */ }
}
function save() {
  try {
    localStorage[LS] = [SAVE.c, SAVE.b, SAVE.d, SAVE.o, SAVE.m, SAVE.t].concat(SAVE.e).join();
  } catch (err) { /* ignore */ }
}

// --- run lifecycle ---------------------------------------------------------
function startRun(sd) {
  audioInit();
  st = 1; score = 0; coins = 0; mult = 1; depth = 0; reg = 0; regShow = 3.2;
  chain = 0; chainN = 0; chainT = 0; fullSpec = 0; combo = 0; comboT = 0;
  deadT = 0; slow = 0; vault = null; shake = 0; flash = 0;
  pig = [PMAX, PMAX, PMAX, PMAX, PMAX, PMAX, PMAX];
  boostT = [0, 0, 0, 0, 0, 0, 0];
  strokes = []; parts = []; trail = []; pops = []; nodes = [];
  drawing = null; wheel = null;
  P.x = 0; P.y = -320; P.vy = 300; P.a = PI / 2;
  P.ra = null; P.te = null; P.ph = 0; P.rp = 0; P.st = 0; P.gt = 0; P.al = 1; P.sp = 300;
  Gx = 0; Gy = GRAV;
  C.x = P.x; C.y = P.y; C.z = 1;
  pal = regPal(0);
  worldReset(sd);
  // After the seed is set, never before: otherwise the opening drift is drawn
  // from whatever PRNG state the previous run happened to leave behind and a
  // seeded replay is not actually reproducible.
  P.vx = rf(-70, 70);
  hint = SAVE.t ? 3 : 0; hintT = 0;
  mStep = 0; if (AC) mNext = AC.currentTime + .05;
  sndRail(0);
}

function endRun() {
  SAVE.c += coins;
  SAVE.b = mx(SAVE.b, score | 0);
  SAVE.d = mx(SAVE.d, depth | 0);
  if (!SAVE.t) { SAVE.t = 1; }
  save();
  sndRail(0);
}

function die() {
  P.al = 0; deadT = 1.3;
  for (let i = 0; i < 7; i++) burst(P.x, P.y, 16, 0, 520, HUE[i]);
  pt(P.x, P.y, 0, 0, .7, -1, 2, 22);
  shake = 30; flash = .7; flashH = -1;
  sndDeath();
  if (P.ra) detachRail(0);
  if (P.te) releaseTether();
  if (st !== 0) endRun();
}

// --- per-frame -------------------------------------------------------------
function update(dt) {
  worldUpdate();

  // Focus Vaults dilate presentation time only; the stall check below uses
  // simulation speed, so slow motion can never fake a death.
  vault = null;
  for (const c of chunks) if (c.v && P.y > c.y + 120 && P.y < c.y + c.h - 120) vault = c;
  const was = slow;
  slow = approach(slow, vault ? 1 : 0, 3.5, dt);
  if (was > .5 && slow <= .5) { burst(P.x, P.y, 14, 0, 420, HUE[6]); sndVector(1); }

  if (P.al) physicsFrame(dt);

  // region progression
  const r = regAt(P.y);
  if (r !== reg) {
    reg = r; regShow = 3.2;
    flash = mx(flash, .35); flashH = regHue(reg);
    sndGate();
    score += 500 * mult | 0;
  }

  // score + multiplier
  if (P.y > depth) { score += (P.y - depth) * .05 * mult; depth = P.y; }
  mult = clamp(1 + P.sp / 950 + chainN * .2 + (fullSpec > 0 ? 2 : 0), 1, 12);

  // Stall is the only failure state: too slow for too long and the run ends.
  if (P.al) {
    if (P.sp < STALLV) {
      P.st += dt;
      const u = clamp((P.st - STALLW) / (STALLT - STALLW), 0, 1);
      if ((stallSnd -= dt) <= 0 && u > 0) { stallSnd = mx(.16, .55 - u * .4); sndStall(u); }
      if (P.st > STALLT) die();
    } else if (P.st > 0) {
      if (P.st > STALLW) burst(P.x, P.y, 8, 0, 260, HUE[0]);
      P.st = mx(0, P.st - dt * 2.6);
    }
  } else {
    deadT -= dt;
    if (deadT <= 0) { if (st === 0) { startRun(); st = 0; } else st = 3; }
  }

  // timers
  regShow -= dt; dryT -= dt; fullSpec -= dt;
  for (let i = 0; i < 7; i++) boostT[i] -= dt;
  if (comboT > 0 && (comboT -= dt) <= 0) combo = 0;
  if (chainT > 0 && (chainT -= dt) <= 0) { chain = 0; chainN = 0; }
  flash = mx(0, flash - dt * 2.4);

  // Strokes age out unless they are being drawn or are the active rail.
  for (let i = strokes.length; i--;) {
    const s = strokes[i];
    if (s !== drawing && s !== P.ra) s.l -= dt;
    if (s.l <= 0) {
      if (P.ra === s) detachRail(1);
      if (s === drawing) drawing = null;
      strokes.splice(i, 1);
    }
  }

  partStep(dt);
  if (P.al) pushTrail();

  // onboarding
  if (!SAVE.t) {
    hintT += dt;
    if (hint === 2 && hintT > 9) { hint = 3; SAVE.t = 1; save(); }
  }
}

function physicsFrame(dt) {
  acc += dt;
  let n = 0;
  while (acc >= HSTEP && n < 8) { physics(HSTEP); acc -= HSTEP; n++; }
  if (n >= 8) acc = 0;
}

// --- draw ------------------------------------------------------------------
function draw() {
  btns = [];
  U = mn(W / 1280, H / 720);
  background();
  drawWorld();
  drawStrokes();
  drawTrail();
  drawParts();
  if (P.al) drawUnicorn();
  if (st === 1 || st === 2) hud();
  if (flash > .01) {
    X.fillStyle = flashH < 0
      ? 'hsl(' + ((T * 500) % 360 | 0) + ' 100% 75% / ' + flash * .5 + ')'
      : hsl(flashH | 0, 100, 72, flash * .45);
    X.fillRect(0, 0, W, H);
  }
  if (st > 1) [0, 0, screenPause, screenResults, screenStore][st]();
  else if (!st) screenTitle();
  if (wheel && st === 1) prismWheel(); else wheel = null;
  cursor();
  if (DEBUG) {
    txt('seed ' + seed + '  v ' + (P.sp | 0) + '  chunks ' + chunks.length + '  parts ' + parts.length +
      '  reg ' + reg + '  st ' + P.st.toFixed(1), 8, H - 10, 12, '#0f0', 'left');
  }
}

// --- main loop -------------------------------------------------------------
function frame(ts) {
  requestAnimationFrame(frame);
  const raw = clamp((ts - last) / 1000, 0, .05);
  last = ts;
  const dt = raw * lerp(1, .4, slow);
  T += dt;
  if (st === 1 || st === 0) update(dt);
  else if (st === 3) partStep(dt);
  camUpdate(raw);
  palUpdate(raw);
  audioFrame();
  draw();
}

// --- boot ------------------------------------------------------------------
load();
resize();
// The title screen shows a live world behind it.
startRun();
st = 0;
P.al = 1;
requestAnimationFrame(frame);
