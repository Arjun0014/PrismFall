<canvas></canvas><script>(()=>{
const DEBUG=1,WD=0;
// ==== config.js ====
// ---------------------------------------------------------------------------
// PRISMFALL - tuning constants.
//
// World units: 1 unit ~= 1 screen pixel at 1280x720 with zoom 1.
// The unicorn is a circle of radius R; everything else is built from
// circles, segments and arcs so the collision kernel stays tiny.
// ---------------------------------------------------------------------------

const PI = Math.PI;
const TAU = PI * 2;
const M = Math;
const abs = M.abs, mn = M.min, mx = M.max, sin = M.sin, cos = M.cos,
      at2 = M.atan2, hyp = M.hypot, flr = M.floor, rnd = M.random;

// -- body / motion ----------------------------------------------------------
const R = 17;          // unicorn collision radius
const GRAV = 1250;     // default gravity magnitude (units/s^2)
const VMAX = 2900;     // hard velocity clamp, keeps the sim sane
const VFAST = 1400;    // "fast" reference speed for camera/audio/score curves

// -- framing ----------------------------------------------------------------
const VH = 620;        // logical view height in world units
const COL = 400;       // standard play-column half width (near-4:3 zone)
const WMAX = 545;      // absolute wall half width (side rooms)

// -- strokes ----------------------------------------------------------------
// Strokes are PERMANENT. A drawing stays on the field until something uses it,
// which is what makes the seven colours a toolkit you can lay out in advance
// and combine, rather than a twitch input that evaporates before you can mix.
// Only a *spent* stroke fades, and only so the consumption reads visually.
const SMAX = 210;      // max stroke length
const SMIN = 22;       // below this a stroke is too short to fire
const SREACH = 305;    // max distance from the unicorn a stroke may start
const SPENT = .22;     // fade-out of a consumed stroke, in seconds
const SLIM = 5;        // simultaneous live strokes (FIFO once exceeded)
const ST = 5;          // stroke half-thickness for collision
// Every colour scales with how long you drew it: pow(L / SNOM, ...) is the one
// rule behind all seven verbs, and pigment already costs per unit length, so
// "bigger effect costs more" needs no extra economy.
const SNOM = 105;      // the length at which a stroke has its nominal strength

// -- pigment ----------------------------------------------------------------
const PMAX = 100;                                  // per-reservoir capacity
const PC = [.088, .055, .062, .07, .05, .076, .095]; // cost per world unit drawn

// -- stall ------------------------------------------------------------------
const STALLV = 118;    // simulation speed below which the stall clock runs
const STALLT = 2.4;    // seconds of stall before the run ends
const STALLW = 0.9;    // stall seconds before the warning kicks in

// -- colours ----------------------------------------------------------------
// Red Orange Yellow Green Blue Indigo Violet - order never changes.
const HUE = [0, 32, 54, 140, 200, 248, 312];
const CBIT = [1, 2, 4, 8, 16, 32, 64];
const ALL7 = 127;

// -- material bits ----------------------------------------------------------
const M_BUMP = 1;    // high restitution
const M_DAMP = 2;    // void / dampener, eats speed - the main stall threat
const M_BREAK = 4;   // shatters above an impact-energy threshold
const M_PHASE = 8;   // solid unless the unicorn is phased (Violet)
const M_ANCH = 16;   // drawn as a Green tether anchor
const M_RAIL = 32;   // drawn as a Blue guide rail
const M_TGT = 64;    // pinball score target: banks light up, a full bank pays out

// -- world ------------------------------------------------------------------
const CHUNKS = 26;       // retained chunk ring size
const REGD = 15000;      // depth of one region
const NREG = 7;          // regions in one descent
const BRK_E = 900;       // impact speed needed to break a panel
const BRK_R = 300;       // ... while Red-charged
const BRK_CH = 150;      // radius a shatter propagates to its neighbours

// -- zones ------------------------------------------------------------------
// A chunk may carry one force field. This is the cheapest way to give a region
// a mechanic of its own rather than only a palette: one number per chunk and
// four lines in the physics step.
// 0 none  1 updraft  2 gravity well  3 crosswind  4 inversion  5 coil  6 current
// Six themed regions, six fields, no two alike -- if two regions shared one
// they would play the same however differently they were painted.
const Z_UP = 1, Z_WELL = 2, Z_WIND = 3, Z_INV = 4, Z_FLOW = 5, Z_RUSH = 6;

// -- items ------------------------------------------------------------------
const I_COIN = 0, I_CROWN = 1, I_PIG = 2, I_WELL = 3, I_BOOST = 4;

// -- boosters ---------------------------------------------------------------
// [colour amplified (7 = every colour's pigment cost), strength, seconds].
// Entirely parameter driven: a booster is a multiplier looked up by the verb
// that cares about it, so adding one is a table row, never a new subsystem.
const BOOST = [
  [0, 1.5, 10],     // Red Overdrive  - bigger kick, cheaper destruction
  [2, 1.5, 11],     // Yellow Supercoil - amplified rebound
  [3, 1.7, 12],     // Green Reach    - longer, stronger tether
  [4, 2, 12],       // Blue Superrail - the rail holds far longer
  [5, 1.9, 11],     // Indigo Flux    - gravity stays bent
  [6, 1.9, 11],     // Violet Echo    - longer phase, longer warp
  [7, .4, 12],      // White Efficiency - every colour costs less
];
const BNAME = 'OVERDRIVE SUPERCOIL REACH SUPERRAIL FLUX ECHO EFFICIENCY'.split(' ');

// -- localStorage namespace -------------------------------------------------
const LS = WD ? 'pf26_save' : 'p';

// ==== state.js ====
// ---------------------------------------------------------------------------
// Global mutable state. Short property names are deliberate: they survive
// minification (Terser will not rename properties) and compress well.
// ---------------------------------------------------------------------------

const CV = document.querySelector('canvas');
const X = CV.getContext('2d');
let W = 0, H = 0, SC = 1;      // canvas pixel size, world->screen scale

// -- game / scene state -----------------------------------------------------
// 0 title  1 playing  2 paused  3 results  4 store
let st = 0;
let T = 0;        // wall-clock seconds since load (drives animation)
let shake = 0;    // camera shake energy
let flash = 0;    // full-screen flash energy
let flashH = 0;   // flash hue
let hstop = 0;    // hit-stop: seconds of near-frozen time after a big impact

// -- the unicorn ------------------------------------------------------------
const P = {
  x: 0, y: 0, vx: 0, vy: 0,
  a: 0,          // render heading
  sp: 0,         // cached speed
  ra: null,      // attached Blue rail (stroke)
  rt: 0,         // rail param along the stroke
  rs: 1,         // rail side (+1/-1)
  rw: 0,         // Superrail: seconds the rail still reflects at its ends
  te: null,      // Green tether {x,y,l,t}
  ph: 0,         // Violet phase timer (ignores solids)
  rp: 0,         // Red power timer (cheap destruction)
  st: 0,         // stall timer
  gt: 0,         // gravity-override timer
  al: 1,         // alive
};

// gravity vector (mutable - Indigo and regions both write here)
let Gx = 0, Gy = GRAV;

// -- camera -----------------------------------------------------------------
const C = { x: 0, y: 0, z: 1, tz: 1 };

// -- run data ---------------------------------------------------------------
let pig = [];              // seven pigment reservoirs
let sel = 1;               // selected colour index
let chain = 0;             // bitmask of colours successfully used in the chain
let chainN = 0;            // popcount of chain
let fullSpec = 0;          // Full Spectrum glow timer
let coins = 0;             // coins earned this run
let score = 0;
let mult = 1;
let depth = 0;             // max depth reached
let reg = 0;               // current region index
let regShow = 0;           // region banner timer
let boostT = [];           // per-booster remaining seconds
let combo = 0, comboT = 0; // coin chain

// -- containers -------------------------------------------------------------
let chunks = [];   // active world chunks
let strokes = [];  // live player strokes
let parts = [];    // particles
let trail = [];    // unicorn trail samples
let pops = [];     // floating score/text pops
let nodes = [];    // prism-node sparkles from stroke fusion
let shocks = [];   // expanding shockwave rings from shatters and big hits

// -- persistent -------------------------------------------------------------
const SAVE = { c: 0, b: 0, d: 0, o: 0, e: [0, 0, 0, 0], m: 0 };
// b best score, d best depth, m muted -- both builds.
// c banked coins, o owned cosmetics bitmask, e equipped [body, horn, trail,
// impact] -- the Wavedash build only. The 13K competition build has no store,
// so every one of those is left at 0 and every site that reads one is behind
// `WD`, which is a compile-time 0 there: Terser folds the branch away and then
// drops the store screen, the cosmetic tables and the four variant renderers
// as unreferenced. One source tree, two products.

// -- input ------------------------------------------------------------------
let pmx = 0, pmy = 0;           // pointer in screen px
let mwx = 0, mwy = 0;         // pointer in world units
let drawing = null;           // stroke being drawn

// ==== colors.js ====
// ---------------------------------------------------------------------------
// The seven colours, pigment economy, stroke drawing and effect composition.
//
// Effects are applied in a fixed order so that any combination of live bits is
// deterministic:  space -> constraint -> gravity -> direction -> bounce -> energy.
// Mixing is therefore free: two overlapping strokes simply OR their bitmasks.
// ---------------------------------------------------------------------------

let chainT = 0;     // seconds left before the colour chain lapses
let dryC = -1, dryT = 0;   // "out of pigment" HUD flash

// Booster lookup: the strength multiplier currently applied to colour c, or 1.
// Colour 7 is the pigment-cost booster.
function bst(c) {
  for (let i = 0; i < 7; i++) if (boostT[i] > 0 && BOOST[i][0] == c) return BOOST[i][1];
  return 1;
}
// How strong a stroke of length L is. Every colour reads this one curve, so
// "draw longer for more of it" is a single rule the player learns once, and
// pigment already bills per unit length so the cost side needs no new economy.
const pw = (L) => .45 + mn(L, SMAX) / SNOM * .55;

// --- drawing ---------------------------------------------------------------
// A stroke may only begin within SREACH of the unicorn; further clicks clamp
// back onto that circle so the player is never silently ignored.
function startStroke() {
  if (st != 1 || !P.al) return;
  if (pig[sel] <= .5) { dryC = sel; dryT = .5; sndEmpty(); return; }
  const dx = mwx - P.x, dy = mwy - P.y, k = mn(1, SREACH / (hyp(dx, dy) || 1));
  const sx = P.x + dx * k, sy = P.y + dy * k;
  // n is the number of times the stroke may fire before it is spent; l is only
  // a fade timer, and only ticks once it has been. A drawing you never use
  // stays on the field for the whole run.
  drawing = { x1: sx, y1: sy, x2: sx, y2: sy, e: CBIT[sel], c: sel, l: 0, u: 0, paid: 0 };
  strokes.push(drawing);
  while (strokes.length > SLIM) if (P.ra == strokes.shift()) detachRail(0);
  if (P.te) releaseTether();
}

// Growing a stroke spends pigment; shrinking it back is free but refunds
// nothing, so length is a real decision.
function moveStroke() {
  const s = drawing;
  if (!s) return;
  const dx = mwx - s.x1, dy = mwy - s.y1, d = hyp(dx, dy);
  if (d < 1) return;
  let L = mn(d, SMAX);
  if (L > s.paid) {
    const unit = PC[s.c] * bst(7), want = (L - s.paid) * unit;
    if (pig[s.c] >= want) { pig[s.c] -= want; s.paid = L; }
    else {
      L = s.paid += pig[s.c] / unit;
      pig[s.c] = 0;
      if (dryT <= 0) { dryC = s.c; dryT = .6; sndEmpty(); }
    }
  }
  s.x2 = s.x1 + dx / d * L; s.y2 = s.y1 + dy / d * L;
  fuse(s);
}

// Overlapping live strokes fuse into a Prism Node and share effect bits.
function fuse(s) {
  for (const o of strokes) {
    if (o == s || o.u || o.e == s.e) continue;
    const p = segX(s.x1, s.y1, s.x2, s.y2, o.x1, o.y1, o.x2, o.y2);
    if (p) {
      s.e = o.e = s.e | o.e;
      nodes.push({ x: p[0], y: p[1], t: .55 });
      sndFuse();
    }
  }
}

// --- collision with a live stroke ------------------------------------------
// A stroke fires once, on the first contact after it is long enough to matter.
function hitStroke(s) {
  const ax = s.x2 - s.x1, ay = s.y2 - s.y1, L = hyp(ax, ay);
  if (s.u || s == drawing || s == P.ra || L < SMIN) return 0;
  const t = segT(s.x1, s.y1, s.x2, s.y2, P.x, P.y);
  const px = s.x1 + ax * t, py = s.y1 + ay * t;
  let nx = P.x - px, ny = P.y - py;
  const d = hyp(nx, ny);
  if (d > R + ST) return 0;
  const ux = ax / L, uy = ay / L;
  if (d < 1e-3) { nx = -uy; ny = ux; } else { nx /= d; ny /= d; }
  applyStroke(s, nx, ny, px, py, t, ux, uy, L);
  hitCd = .05;
  return 1;
}

function applyStroke(s, nx, ny, px, py, t, ux, uy, L) {
  const b = s.e;
  const q = pw(L);          // length -> strength, the rule shared by all seven
  let consume = 1;

  // 1 --- SPACE (Violet) ----------------------------------------------------
  // With a second live Violet stroke on screen the pair becomes a portal and
  // the exit angle rotates your velocity; alone it is a phase dash that passes
  // straight through the next obstacle. Fused with Blue it phases a whole rail.
  if (b & 64) {
    const vb = bst(6);
    if (b & 16) P.ph = .8 * vb;
    else {
      let o2 = 0;
      for (const o of strokes) if (o != s && !o.u && o.e & 64) { o2 = o; break; }
      warpFX(P.x, P.y);
      if (o2) {
        const da = at2(o2.y2 - o2.y1, o2.x2 - o2.x1) - at2(uy, ux), ca = cos(da), sa = sin(da);
        const vx = P.vx * ca - P.vy * sa, vy = P.vx * sa + P.vy * ca;
        const k = (R + ST + 8) / (hyp(vx, vy) || 1);
        P.vx = vx; P.vy = vy;
        P.x = (o2.x1 + o2.x2) / 2 + vx * k;
        P.y = (o2.y1 + o2.y2) / 2 + vy * k;
        o2.u = 1; o2.l = .12;
      } else {
        // A lone Violet stroke is a dash along the current heading - or, from a
        // standstill, straight off the face of the stroke, so Violet is also an
        // escape tool rather than a no-op when you need it most.
        const sp = hyp(P.vx, P.vy);
        const reach = 300 * vb * q;
        if (sp < 60) { P.x += nx * reach; P.y += ny * reach; P.vx = nx * 460; P.vy = ny * 460; }
        else { const k = reach / sp; P.x += P.vx * k; P.y += P.vy * k; }
      }
      // Land inside the shaft, whatever the exit geometry said.
      wallsAt(P.y);
      P.x = clamp(P.x, _wl + R, _wr - R);
      P.ph = .34 * vb * q; P.vx *= 1.07; P.vy *= 1.07;
      warpFX(P.x, P.y);
    }
    sndWarp();
  }

  // 2 --- CONSTRAINT (Blue rail, Green tether) ------------------------------
  if (b & 16) {
    if (P.te) releaseTether();
    P.ra = s; P.rt = t;
    // Superrail does not extend a timer -- the rail already lasts as long as
    // the line does. It makes the rail reflect at its ends instead of dropping
    // you, so a short line becomes a shuttle you can ride.
    P.rw = bst(4) > 1 ? 4 : 0;
    P.rs = nx * -uy + ny * ux >= 0 ? 1 : -1;
    const sp = mx(hyp(P.vx, P.vy), 340 + 180 * q);
    const dir = P.vx * ux + P.vy * uy >= 0 ? 1 : -1;
    P.vx = ux * sp * dir; P.vy = uy * sp * dir;
    consume = 0;
    sndRail(1);
  } else if (b & 8) {
    if (P.ra) detachRail(0);
    const gb = bst(3);
    // The pin is where you began the drag and the rope is as long as the line
    // you drew -- so the swing you get is the swing you can see before you
    // commit, at any size you like. Nothing is clamped away.
    P.te = { x: s.x1, y: s.y1, l: mx(L * gb, 30), t: (1.4 + q) * gb };
    sndTether(1);
  }

  // 3 --- GRAVITY (Indigo) --------------------------------------------------
  if (b & 32) {
    Gx = nx * GRAV; Gy = ny * GRAV; P.gt = 2.9 * bst(5) * q;
    sndGrav(ny);
    burst(px, py, 10, 3, 150, HUE[5]);
  }

  // 4/5 --- DIRECTION (Orange) / BOUNCE (Yellow) ----------------------------
  const dirB = b & 2, sprB = b & 4;
  if (dirB) {
    const sp = hyp(P.vx, P.vy);
    const ns = sprB ? mx(sp * 1.34, 560 + 320 * q) : mx(sp * .99, 250 + 250 * q);
    P.vx = ux * ns; P.vy = uy * ns;
    sndVector(sprB);
  } else if (sprB) {
    const vn = P.vx * nx + P.vy * ny, e = (1.25 + .6 * q) * bst(2);
    P.vx -= (1 + e) * vn * nx; P.vy -= (1 + e) * vn * ny;
    // The floor scales with the impact so a spring stays impact-driven: it pops
    // you off on a glancing hit, but it can never rescue a dead-stopped unicorn.
    // That job belongs to Red.
    const on = P.vx * nx + P.vy * ny, fl = mn(300 + 300 * q, abs(vn) * 1.6);
    if (on < fl) { P.vx += (fl - on) * nx; P.vy += (fl - on) * ny; }
    sndSpring(abs(vn));
  } else if (!(b & 89)) {              // 89 = red|tether|rail|violet
    const vn = P.vx * nx + P.vy * ny;
    if (vn < 0) { P.vx -= 1.55 * vn * nx; P.vy -= 1.55 * vn * ny; }
  }

  // 6 --- ENERGY (Red) ------------------------------------------------------
  // Red never rebounds the way Yellow does: it mirrors the *aim* off the line so
  // it can't fire the unicorn back into it, then injects a fixed amount of
  // energy. That is why Red still works from a dead stop and Yellow does not.
  if (b & 1) {
    const rk = bst(0);
    let sp = hyp(P.vx, P.vy), dxn, dyn;
    if (sp < 50) { dxn = nx; dyn = ny; sp = 0; }
    else {
      dxn = P.vx / sp; dyn = P.vy / sp;
      const vn = dxn * nx + dyn * ny;
      if (vn < 0) { dxn -= 2 * vn * nx; dyn -= 2 * vn * ny; }
    }
    const ns = sp * 1.5 + 440 * rk * q;
    P.vx = dxn * ns; P.vy = dyn * ns;
    P.rp = .85;
    shake = mn(26, shake + 7);
    shock(px, py, 120 + 160 * q, HUE[0]);
    burst(px, py, 26, 0, 220, HUE[0], -dxn * 420, -dyn * 420);
    // Red is the destruction verb: the blast shatters every panel it reaches,
    // which then chains through its own neighbours.
    const bl = (90 + 110 * q) * rk;
    for (const c of NC) for (const o of c.o)
      if (!o.k && !o.kt && o.m & M_BREAK && hyp(o.x - px, o.y - py) < bl + o.r) { o.kt = .02; o.kd = 0; }
    sndBoost(ns);
  }

  clampV();
  if (consume) { s.u = 1; s.l = SPENT; }
  strokeFX(s, px, py);
  chainAdd(b);
}

// --- spectrum chain --------------------------------------------------------
// Successfully landing a new colour extends the spectrum chain. Refunds are
// deliberately partial: a perfect seven-colour loop never pays for itself.
function chainAdd(b) {
  const before = chain;
  chainT = 7;
  chain |= b & ALL7;
  if (chain == before) return;
  let n = 0;
  for (let i = 0; i < 7; i++) if (chain & CBIT[i]) n++;
  if (n <= chainN) return;
  chainN = n;
  if (n == 7) return fullSpectrum();
  if (n == 3 || n == 5) {
    for (let i = 0; i < 7; i++) pig[i] = mn(PMAX, pig[i] + 6);
    pop(P.x, P.y - 30, 'SPECTRUM ' + n + '/7', HUE[n]);
    sndRefund();
  }
}

function fullSpectrum() {
  fullSpec = 3.2;
  for (let i = 0; i < 7; i++) pig[i] = mn(PMAX, pig[i] + 26);
  mult = mn(12, mult + 1.5);
  score += 1200 * mult | 0;
  flash = 1; flashH = -1;
  shake = mn(32, shake + 14);
  pop(P.x, P.y - 46, 'FULL SPECTRUM', -1);
  sndSpectrum();
  chain = 0; chainN = 0;
}

// --- pickups ---------------------------------------------------------------
function grab(it) {
  it.g = 1;
  if (it.t == I_COIN) {
    combo++; comboT = 1.4; coins += 1;
    score += 10 * mult * (1 + combo * .05) | 0;
    sndCoin(combo);
  } else if (it.t == I_CROWN) {
    coins += 15; score += (500 * mult) | 0;
    pop(it.x, it.y, 'CROWN +15', 48);
    flash = mx(flash, .45); flashH = 48;
    sndCrown();
  } else if (it.t == I_PIG) {
    pig[it.c] = mn(PMAX, pig[it.c] + 40);
    sndPig(it.c);
    burst(it.x, it.y, 12, 3, 190, HUE[it.c]);
  } else if (it.t == I_WELL) {
    for (let i = 0; i < 7; i++) pig[i] = PMAX;
    flash = 1; flashH = -1;
    pop(it.x, it.y, 'PRISM WELL', -1);
    sndWell();
  } else {
    boostT[it.c] = BOOST[it.c][2];
    pop(it.x, it.y, BNAME[it.c], BOOST[it.c][0] > 6 ? -1 : HUE[BOOST[it.c][0]]);
    sndPower();
  }
}

// ==== physics.js ====
// ---------------------------------------------------------------------------
// Simulation: semi-fixed timestep, adaptive substeps, circle-vs-{circle,
// segment, arc} collision, plus the Blue rail and Green tether constraints.
// ---------------------------------------------------------------------------

let NC = [];        // chunks near the unicorn this step
let hitCd = 0;      // global stroke retrigger cooldown

// Velocity clamp plus a NaN guard: no combination of effects may destabilise
// the simulation.
function clampV() {
  const s = hyp(P.vx, P.vy);
  if (s > VMAX) { P.vx = P.vx / s * VMAX; P.vy = P.vy / s * VMAX; }
  if (!isFinite(s)) { P.vx = 0; P.vy = 200; }
  if (!isFinite(P.x + P.y)) { P.x = 0; P.y = depth; }
}

// --- constraints -----------------------------------------------------------
function detachRail(boost) {
  const s = P.ra;
  if (s) { s.u = 1; s.l = mn(s.l, .12); }
  P.ra = null;
  if (boost) { P.vx *= 1.06; P.vy *= 1.06; }
  sndRail(0);
}

function railStep(h) {
  const s = P.ra;
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1, L = hyp(dx, dy);
  // A rail lasts as long as its line does, and its line is permanent. You come
  // off it by reaching an end, by hitting something, or by pressing X.
  if (s.u || L < 8) { detachRail(1); return 0; }
  const ux = dx / L, uy = dy / L;
  let sp = P.vx * ux + P.vy * uy;
  sp = sp * .998 + (Gx * ux + Gy * uy) * h;
  const floor_ = 370;
  if (abs(sp) < floor_) {
    const gd = Gx * ux + Gy * uy;
    sp = (gd ? (gd > 0 ? 1 : -1) : sp >= 0 ? 1 : -1) * floor_;
  }
  P.rt += sp * h / L;
  P.vx = ux * sp; P.vy = uy * sp;
  if (P.rt < 0 || P.rt > 1) {
    P.rt = clamp(P.rt, 0, 1);
    // Superrail reflects at the ends instead of dropping you, turning even a
    // short line into a shuttle.
    if (P.rw > 0) { P.rw -= h; P.vx = -P.vx; P.vy = -P.vy; P.rt = clamp(P.rt, .02, .98); sndSpring(400); }
    else { detachRail(1); return 0; }
  }
  const nx = -uy * P.rs, ny = ux * P.rs;
  P.x = s.x1 + dx * P.rt + nx * (R + ST);
  P.y = s.y1 + dy * P.rt + ny * (R + ST);
  if (rnd() < .5) burst(P.x, P.y, 3, 0, 60, HUE[4], -P.vx * .1, -P.vy * .1);
  return 1;
}

// Releasing a tether converts the orbit into a launch.
function releaseTether() {
  if (!P.te) return;
  P.te = null;
  const s = hyp(P.vx, P.vy) || 1, k = 1.34 + 150 / s;
  P.vx *= k; P.vy *= k;
  clampV();
  burst(P.x, P.y, 10, 0, 260);
  sndTether(0);
}

// Inextensible rope: pull the body back onto the circle and drop the radial
// velocity. Orbits gain a hair of energy so a swing never quietly dies.
function tetherConstrain() {
  const t = P.te;
  let dx = P.x - t.x, dy = P.y - t.y;
  const d = hyp(dx, dy);
  if (d < 1 || d <= t.l) return;
  dx /= d; dy /= d;
  P.x = t.x + dx * t.l; P.y = t.y + dy * t.l;
  const vr = P.vx * dx + P.vy * dy;
  if (vr > 0) { P.vx -= vr * dx; P.vy -= vr * dy; }
  const s = hyp(P.vx, P.vy);
  if (s > 1 && s < 1500) { const k = mx(1.004, 320 / s); P.vx *= k; P.vy *= k; }
}

// --- item pickup -----------------------------------------------------------
// At a high style multiplier loose coins arc toward the unicorn. It is a
// reward for keeping a chain alive, never a substitute for aim: the radius
// only opens up once the multiplier is already high, and it pulls coins only.
function items(h) {
  const mag = mult > 4 ? 60 + mult * 24 : 0;
  for (const c of NC) for (const it of c.i) {
    if (it.g) continue;
    const dx = P.x - it.x, dy = P.y - it.y, d = hyp(dx, dy);
    if (d < R + 26) { grab(it); continue; }
    if (mag && !it.t && d < mag) {
      const k = mn(1, 700 * h / d);
      it.x += dx * k; it.y += dy * k;
    }
  }
}

// --- obstacle collision ----------------------------------------------------
function collideAll(h) {
  for (const c of NC) for (const o of c.o) { if (!o.k) hitOb(o); }
  if (hitCd > 0) hitCd -= h;
  else for (let i = 0; i < strokes.length; i++) { if (hitStroke(strokes[i])) break; }
}

function hitOb(o) {
  obT(o);
  const rr2 = near(o, P.x, P.y) + R;
  if (_pd > rr2) return;
  const nx = _nx, ny = _ny, px = _px, py = _py, pen = rr2 - _pd;
  if (o.m & M_PHASE) { if (P.ph > 0) return; }
  obVel(o, px, py);
  let rvx = P.vx - _cvx, rvy = P.vy - _cvy;
  const vn = rvx * nx + rvy * ny;

  if (o.m & M_BREAK) {
    const imp = -vn;
    if (imp > (P.rp > 0 ? BRK_R : BRK_E)) { shatter(o, px, py, imp, 0); return; }
  }

  P.x += nx * pen; P.y += ny * pen;
  if (P.ra) detachRail(0);
  if (vn >= 0) return;

  const bump = o.m & M_BUMP, damp = o.m & M_DAMP;
  o.f = 1;                                   // contact flash, read by the renderer
  if (o.m & M_TGT) light(o, px, py);
  // A bumper's restitution falls off with speed: it kicks hard when you are
  // slow (a genuine rescue) and bleeds energy when you are already flying.
  // Without this the world is a closed energy pump and every run saturates at
  // VMAX, which reads as noise rather than pinball.
  const e = bump ? 1.32 - clamp(P.sp / VMAX, 0, 1) * .72 : damp ? .12 : .44;
  const j = (1 + e) * -vn;                 // normal impulse magnitude
  rvx += j * nx; rvy += j * ny;

  // Coulomb friction: the tangential loss is capped by the normal impulse, not
  // taken as a flat fraction of sliding speed. Resting contact therefore barely
  // scrubs speed, so surfaces stop behaving like glue and a grazing skim keeps
  // its momentum. The flat-fraction version stopped a 440-unit launch in three
  // frames and made every ledge an unescapable trap.
  const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty;
  const dv = mn(abs(vt), (damp ? 1.15 : .3) * j) * (vt < 0 ? -1 : 1);
  rvx -= dv * tx; rvy -= dv * ty;
  P.vx = rvx + _cvx; P.vy = rvy + _cvy;
  clampV();

  const imp = -vn;
  sndHit(imp, damp ? 1 : bump ? 2 : 0, o.x + o.y);
  shake = mn(26, shake + imp * (bump ? .008 : .0035));
  const n = clamp(imp * .012, 1, 14) | 0;
  burst(px, py, n, 1, mn(imp * .35, 420), geoHue(o));

  // A bumper is a scoring event, not just a wall. It pays, it feeds the same
  // combo the coins do, and above a real impact it stops time for a frame and
  // throws a ring -- which is the whole difference between hitting geometry
  // and playing a pinball table.
  if (bump && imp > 150) {
    combo++; comboT = 1.6;
    const v = (18 + imp * .05) * mult | 0;
    score += v;
    if (imp > 620) {
      pop(px, py, '+' + v, HUE[2]);
      shock(px, py, 60 + mn(imp * .2, 190), pal[6] + 30);
      hstop = mx(hstop, .045);
    }
  }
}

// A scoring target lights on contact; lighting the last one in its bank pays
// the whole bank out and re-arms it.
function light(o, px, py) {
  if (o.lt) return;
  const k = o.bk;
  o.lt = 1;
  if (!k) return;
  k.l++;
  const v = 60 * mult | 0;
  score += v;
  sndTarget(k.l / k.n);
  burst(px, py, 10, 0, 260, 48);
  if (k.l < k.n) return;
  // Bank cleared: pay out, refill a little pigment, re-arm.
  k.l = 0;
  for (const q of k.m) q.lt = 0;
  const big = 420 * k.n * mult | 0;
  score += big;
  coins += k.n * 2;
  for (let i = 0; i < 7; i++) pig[i] = mn(PMAX, pig[i] + 5);
  pop(k.x, k.y, 'BANK +' + big, 48);
  shock(k.x, k.y, 320, 48);
  flash = mx(flash, .4); flashH = 48;
  shake = mn(30, shake + 12);
  hstop = mx(hstop, .07);
  sndBank();
}

// Breaking a panel throws real debris and lights the fuse on its neighbours,
// so one good hit unzips a whole structure instead of punching a single hole.
// `d` is the cascade depth, purely so the chain reads as a wave outward.
function shatter(o, px, py, imp, d) {
  o.k = 1;
  const h = geoHue(o);
  shake = mn(32, shake + 10 - d);
  burst(px, py, 18, 2, 460, h);
  shards(px, py, o, h);
  shock(px, py, 150, h);
  sndBreak(d);
  const v = 60 * mult * (1 + d * .5) | 0;
  score += v;
  combo++; comboT = 1.6;
  if (!d) { pop(px, py, '+' + v, 45); hstop = mx(hstop, .05); }

  // Light the fuse on every breakable neighbour. Staggering by distance turns
  // a cluster into a chain rather than a single silent frame.
  if (d > 3) return;
  const rad = BRK_CH;
  for (const c of NC) for (const q of c.o) {
    if (q == o || q.k || q.kt || !(q.m & M_BREAK)) continue;
    const dd = hyp(q.x - px, q.y - py);
    if (dd < rad + q.r) { q.kt = .04 + dd / rad * .1; q.kd = d + 1; }
  }
  P.vx *= .9; P.vy *= .9;
}

// Fuses lit by a cascade, ticked once per frame from the game loop.
function fuseStep(h) {
  for (const c of chunks) for (const o of c.o) {
    if (!o.kt || o.k) continue;
    if ((o.kt -= h) > 0) continue;
    obT(o);
    shatter(o, _cx, _cy, 0, o.kd);
  }
}

// Debris: spinning shards that carry the colour of what they came from.
function shards(x, y, o, h) {
  for (let i = 0; i < 7; i++) {
    const a = rf(0, TAU), v = rf(90, 420);
    pt(x, y, cos(a) * v, sin(a) * v, rf(.5, 1.1), h, 4, rf(3, 8) * (o.t ? 1 : 1.4));
  }
}

const geoHue = (o) => o.m & M_DAMP ? 280 : o.m & M_BREAK ? 20 : o.m & M_PHASE ? 285 : pal[6];

// --- main step -------------------------------------------------------------
function physics(h) {
  const sp0 = hyp(P.vx, P.vy);
  NC = nearChunks(P.y - 420 - sp0 * h, P.y + 420 + sp0 * h);

  // The region's force field, sampled at the body's own position.
  let fx = Gx, fy = Gy;
  for (const c of NC) if (c.z && P.y >= c.y && P.y < c.y + c.h) {
    zoneF(c, P.x, P.y);
    fx += _zx; fy += _zy;
    break;
  }

  if (P.te) {
    P.te.t -= h;
    // No reel-in: the radius stays exactly the length you drew, which is the
    // whole contract of this verb. The orbit is topped up in tetherConstrain
    // instead, so a swing still never quietly dies.

    P.vx += fx * h; P.vy += fy * h;
    if (P.te.t <= 0) releaseTether();
  } else if (P.ra) {
    // rail supplies its own motion
  } else {
    P.vx += fx * h; P.vy += fy * h;
  }
  clampV();

  // Drag above the "fast" reference speed. Bumpers, rotors and Red together
  // form an open energy pump, and without this the run spends half its life
  // pinned to VMAX -- the hard clamp ends up setting the pace of the game
  // instead of the player. Below VFAST there is no drag at all, so recovering
  // from a stall is never taxed.
  let sp = hyp(P.vx, P.vy);
  const vf = VFAST;
  if (sp > vf) {
    const d = mx(0, 1 - (sp / vf - 1) * 1.5 * h);
    P.vx *= d; P.vy *= d;
    sp *= d;
  }

  const k = clamp(M.ceil(sp * h / (R * .55)), 1, 8);
  const hh = h / k;
  for (let i = 0; i < k; i++) {
    if (P.ra) { if (!railStep(hh)) { P.x += P.vx * hh; P.y += P.vy * hh; } }
    else { P.x += P.vx * hh; P.y += P.vy * hh; }
    if (P.te) tetherConstrain();
    collideAll(hh);
    items(hh);
  }

  // Absolute containment: no effect (warp included) may leave the shaft. This
  // is measured against the real wall line at the unicorn's height, not a fixed
  // bound, because the walls taper and a warp could otherwise strand it in the
  // rock outside them.
  wallsAt(P.y);
  if (P.x < _wl + R) { P.x = _wl + R; if (P.vx < 0) P.vx = -P.vx * .55 + 60; }
  if (P.x > _wr - R) { P.x = _wr - R; if (P.vx > 0) P.vx = -P.vx * .55 - 60; }

  // timers
  if (P.ph > 0) P.ph -= h;
  if (P.rp > 0) P.rp -= h;
  if (P.gt > 0) {
    P.gt -= h;
    if (P.gt <= 0) { Gx = 0; Gy = GRAV; }
  }
  P.sp = hyp(P.vx, P.vy);
  if (P.sp > 30) P.a = at2(P.vy, P.vx);
}

// ==== world.js ====
// ---------------------------------------------------------------------------
// World: region table, chunk grammar, obstacle + reward generation.
//
// The world is a ring of vertical chunks. Every chunk picks an archetype from
// its region's weight string and decorates it with region material bias, so
// world identity is systematic instead of seven separate generators.
// ---------------------------------------------------------------------------

// Archetype ids used inside the region weight strings. Funnel and Sieve are
// the same builder with different parameters, so eight situations cost seven.
// 0 PEG  1 FUNNEL  2 BOWL  3 SHAFT  4 ROTOR  5 SIEVE  6 CHAMBER
// 7 TARGET BANK  8 CRUSHER LANE

// Region row. Everything a region needs beyond these nine numbers is derived,
// which costs far fewer compressed bytes than a table:
//   0 name
//   1 base hue        background gradient starts here
//   2 hue spread      gradient end + geometry hue are offsets from the base
//   3 geometry light
//   4 background light
//   5 archetype weights (one char per draw)
//   6 filler density  extra scattered geometry per chunk
//   7 zone type       the force field that gives the region its mechanic
//   8 zone frequency  0..9, chunks in ten that carry the field
//   9 geometry hue     absolute; -1 means "cycle" (the Rainbow Engine)
// Affinity colours come from AFF, music from formulas in 60_audio.js.
//
// A region is a *mechanic* first and a palette second. Each row below pairs a
// force field with the archetypes and materials that make that field matter,
// so the seven descents ask genuinely different things of the player rather
// than recolouring the same shaft.
const REG = [
  // Sky. Updraft columns hold you up, so descending is something you do on
  // purpose. Round, soft, bumper-heavy: the region that teaches the verbs.
  ['CLOUDBREAK', 206, 74, 88, 26, '0002100210', 5, Z_UP, 5, 40],
  // Furnace. Almost everything is breakable and chains into its neighbours;
  // crusher lanes and rotors do the breaking for you if you build speed.
  ['SUNFORGE', 12, 34, 72, 19, '8574185741', 7, Z_WIND, 4, 196],
  // Overgrown spiral. Anchors and springy pods everywhere, and a slipstream
  // that curls you around them - the region the Green tether was built for.
  ['VERDANT COIL', 152, -74, 74, 17, '2622762262', 8, Z_FLOW, 6, 320],
  // Glass river. Long rails, narrow throats, flow that carries you along them.
  ['CRYSTAL CURRENT', 190, 44, 84, 15, '3303531333', 5, Z_RUSH, 7, 25],
  // Dark mine. Phase walls hide pockets, gravity wells drag you into them, and
  // the reward density is the highest in the game.
  ['PRISM MINE', 276, -28, 62, 10, '6760671666', 9, Z_WELL, 6, 120],
  // Temple. Inversion fields turn the shaft upside down; the geometry is built
  // to be read from both directions.
  ['INVERSION TEMPLE', 264, 52, 80, 13, '6465264636', 7, Z_INV, 7, 75],
  // The Engine. Every archetype, every field, maximum density.
  ['RAINBOW ENGINE', 300, -136, 90, 9, '0123456788', 9, 0, 9, -1],
];
// Material bias per region, as five hex nibbles read left to right:
//   BREAK PHASE DAMP BUMP MOVE, each out of 16.
// This table is most of what a region feels like under the unicorn. Cloudbreak
// is nearly all bumpers and nothing that eats speed; Sunforge is three quarters
// breakable; the Mine is the only place that is genuinely sticky. Dampeners
// stay scarce everywhere because they are the one material that can kill you.
const BIAS = [0x000b4, 0xc016a, 0x201a6, 0x11153, 0xa9332, 0x4a355, 0x6528b];
// Two affinity colours per region, one digit each, straight from the world spec:
// Cloudbreak O+Y, Sunforge R+O, Verdant G+Y, Crystal B+O, Mine R+V, Temple I+V.
const AFF = '120132410656';
const bit = (b, i) => (b >> (16 - i * 4) & 15) / 16;
// The Rainbow Engine's affinity is "all colours", so it rolls fresh each time.
const aff = (r) => r > 5 ? [ri(0, 6), ri(0, 6)] : [+AFF[r * 2], +AFF[r * 2 + 1]];

let nextY = 0, prevL = -COL, prevR = COL, cIdx = 0, seed = 1;
// Shared build context for the archetype builders: the playable span, its
// centre and width, the region's material bias and the current difficulty.
// Set once per chunk by genChunk so no builder has to take seven parameters.
let bL = 0, bR = 0, bW = 0, bX = 0, bB = 0, bD = 0;

// A chunk record: span, entry walls, obstacles, items, region, archetype, field, banks.
const mkChunk = (y, h, l, r, pl, pr) => ({ y, h, l, r, pl, pr, o: [], i: [], rg: regAt(y), k: 0, z: 0, bk: [] });

// --- obstacle constructors -------------------------------------------------
// One shape record covers both primitives: t 0 is a circle of radius r, t 1 is
// a segment of half-length r at angle g. Sharing the field means the collision
// probe, the renderer and the placement test all read the same two numbers.
const ci = (x, y, r, m, e) => Object.assign({ t: 0, x, y, r, g: 0, m: m | 0 }, e);
const sg = (x, y, r, g, m, e) => Object.assign({ t: 1, x, y, r, g, m: m | 0 }, e);
// segment from A to B
const sgAB = (ax, ay, bx, by, m, e) =>
  sg((ax + bx) / 2, (ay + by) / 2, hyp(bx - ax, by - ay) / 2, at2(by - ay, bx - ax), m, e);

const item = (t, x, y, c) => ({ t, x, y, c: c | 0, g: 0 });

// Arcs are built from straight segments, so the collision kernel only ever
// deals with circles and segments - and the facets suit the geometric look.
function arcSegs(c, x, y, r, a0, a1, m) {
  const n = mx(3, (a1 - a0) * r / 80 | 0);
  for (let i = 0; i < n; i++) {
    const b0 = lerp(a0, a1, i / n), b1 = lerp(a0, a1, (i + 1) / n);
    c.o.push(sgAB(x + cos(b0) * r, y + sin(b0) * r, x + cos(b1) * r, y + sin(b1) * r, m));
  }
}

// --- current transform of an obstacle --------------------------------------
// Results land in scratch globals to avoid per-frame allocation.
let _cx = 0, _cy = 0, _cvx = 0, _cvy = 0, _cg = 0;
// Closest-point scratch, filled by near().
let _px = 0, _py = 0, _nx = 0, _ny = 0, _pd = 0;
function obT(o) {
  _cx = o.x; _cy = o.y; _cvx = 0; _cvy = 0; _cg = o.g;
  if (o.os) {
    const p = o.os * T + o.op, s = sin(p), c = cos(p) * o.os;
    _cx += o.ox * s; _cy += o.oy * s;
    _cvx = o.ox * c; _cvy = o.oy * c;
  }
  if (o.w) _cg += o.w * T;
}
// Surface velocity of obstacle o at world point (px,py).
function obVel(o, px, py) {
  if (o.w) { _cvx += -o.w * (py - _cy); _cvy += o.w * (px - _cx); }
}

// --- material roll ---------------------------------------------------------
function mat(b, allowBreak) {
  return rp(bit(b, 2)) ? M_DAMP
    : allowBreak && rp(bit(b, 0)) ? M_BREAK
      : rp(bit(b, 1)) ? M_PHASE
        : rp(bit(b, 3)) ? M_BUMP : 0;
}
// Optional motion decoration: a straight oscillation along a random axis.
function moving(b, amp) {
  if (!rp(bit(b, 4))) return null;
  const a = rf(0, TAU);
  return { ox: cos(a) * amp, oy: sin(a) * amp * .6, os: rf(.7, 1.9), op: rf(0, TAU) };
}

// --- region helpers --------------------------------------------------------
const regAt = (y) => { const i = flr(mx(y, 0) / REGD); return i < 7 ? i : i % 7; };
const loopAt = (y) => flr(flr(mx(y, 0) / REGD) / 7);
const difAt = (y) => clamp(flr(mx(y, 0) / REGD) * .085 + loopAt(y) * .3, 0, 2.4);

// Closest point on obstacle o (in whatever pose the scratch globals hold) to
// (x,y). Leaves the point in _px/_py, the unit normal pointing back at the
// query in _nx/_ny and the distance in _pd, and returns the obstacle's surface
// radius so callers can compare. Shared by collision and by the generator's
// placement probe, which used to carry its own copy of this arithmetic.
function near(o, x, y) {
  if (!o.t) {
    _nx = x - _cx; _ny = y - _cy; _pd = hyp(_nx, _ny);
    if (_pd < 1e-4) { _nx = 0; _ny = -1; _pd = 1e-4; } else { _nx /= _pd; _ny /= _pd; }
    _px = _cx + _nx * o.r; _py = _cy + _ny * o.r;
    return o.r;
  }
  const cg = cos(_cg) * o.r, sg2 = sin(_cg) * o.r;
  const ax = _cx - cg, ay = _cy - sg2, bx = _cx + cg, by = _cy + sg2;
  const t = segT(ax, ay, bx, by, x, y);
  _px = ax + (bx - ax) * t; _py = ay + (by - ay) * t;
  _nx = x - _px; _ny = y - _py; _pd = hyp(_nx, _ny);
  if (_pd < 1e-4) { _nx = -sin(_cg); _ny = cos(_cg); _pd = 1e-4; } else { _nx /= _pd; _ny /= _pd; }
  return ST;
}

// --- solidity probe --------------------------------------------------------
// Deliberately measured against each obstacle's *base* pose, not its animated
// one: placement has to be deterministic for a seed, and a moving arm sweeping
// over a coin is the intended risk rather than a bad spawn.
function solidNear(c, x, y, rad) {
  for (const o of c.o) {
    _cx = o.x; _cy = o.y; _cg = o.g;
    if (near(o, x, y) + rad > _pd) return 1;
  }
  return 0;
}

// ---------------------------------------------------------------------------
// Chunk generation
// ---------------------------------------------------------------------------
function genChunk() {
  const y = nextY;
  const rg = regAt(y), dif = difAt(y), b = BIAS[rg];
  const boundary = flr((y + 1400) / REGD) > flr(y / REGD) && y > 200;

  // Wall profile: side pockets widen the column, shafts narrow it.
  const wide = rp(.25) ? 120 : 0;
  const l = clamp(-COL + rf(-90, 70) - wide, -WMAX, -300);
  const r = clamp(COL + rf(-70, 90) + wide, 300, WMAX);
  const h = boundary ? 1200 : ri(700, 1200);

  const c = mkChunk(y, h, l, r, prevL, prevR);

  // Walls, drawn as chunk-to-chunk segments so the column is continuous.
  c.o.push(sgAB(prevL, y, l, y + h, 0), sgAB(prevR, y, r, y + h, 0));

  bL = mx(prevL, l) + 30; bR = mn(prevR, r) - 30;
  bW = bR - bL; bX = (bL + bR) / 2; bB = b; bD = dif;

  if (boundary) buildGate(c);
  else {
    const k = +REG[rg][5][ri(0, 9)];
    c.k = k;
    // The region's force field. It is what makes a descent feel like a place:
    // Cloudbreak holds you up, the Temple turns you over, the Coil and the
    // Current sweep you sideways, the Mine drags you into its pockets.
    if (cIdx > 1 && ri(0, 9) < REG[rg][8]) c.z = REG[rg][7] || ri(1, 5);
    if (k == 1 || k == 5)
      barrier(c, k > 1 ? ri(2, 3) : 1, k > 1 ? rf(0, 26) : rf(120, 200), c.y + c.h * rf(.3, .6), 0);
    else [pegField, 0, bowl, shaft, rotor, 0, chamber, targets, crushers][k](c);
    decorate(c, REG[rg][6] + (dif * 1.6 | 0));
    rewards(c, rg);
  }

  // Nothing is allowed to spawn inside solid geometry, whichever builder placed it.
  c.i = c.i.filter((it) => !solidNear(c, it.x, it.y, R * .6));

  prevL = l; prevR = r; nextY = y + h; cIdx++;
  chunks.push(c);
  if (chunks.length > CHUNKS) chunks.shift();
  return c;
}

// Region-flavoured filler. Every archetype leaves gaps; this scatters small
// interactive geometry into them so a screen always has something to hit,
// which is what makes the game read as pinball rather than as empty shafts.
// It refuses any spot that would crowd existing geometry, so it can never seal
// a route it did not create.
function decorate(c, n) {
  // Keep trying until the quota is met: shaft and rotor chunks reject most
  // candidates, and those are exactly the chunks that read as empty.
  for (let tries = n * 6; n > 0 && tries--;) {
    const x = rf(bL + 40, bR - 40), y = c.y + rf(.07, .93) * c.h;
    const cir = rp(.6), rad = rf(13, 26), hl = rf(30, 70), a = rf(0, PI);
    // One clearance test, taken at the piece's full reach rather than at each
    // extremity in turn. A disc of radius hl + 48 around the centre contains
    // the whole segment, so this is STRICTER than the three-point version it
    // replaced -- it can still never close a route, it just rejects a few more
    // candidates, which the tries budget already absorbs.
    if (solidNear(c, x, y, 48 + (cir ? rad : hl))) continue;
    n--;
    // Half the scatter is live pinball furniture: bumpers that kick, targets
    // that light, panels that shatter. A screen should always contain
    // something worth hitting on purpose.
    c.o.push(cir
      ? ci(x, y, rad, mat(bB, 0) | (rp(.5) ? M_BUMP : rp(.3) ? M_TGT : 0), moving(bB, 70))
      : sg(x, y, hl, a, mat(bB, 1) | (rp(.22) ? M_ANCH : 0), moving(bB, 60)));
    if (c.o[c.o.length - 1].m & M_TGT) tag(c, c.o[c.o.length - 1], 3);
  }
}

// Register an obstacle as a member of a scoring bank. Every target in a bank
// lights independently; lighting the last one pays the whole bank out and
// resets it, so a bank is a repeatable objective rather than a one-off pickup.
function tag(c, o, cap) {
  let k = c.bk[c.bk.length - 1];
  if (!k || k.n >= k.cap) { k = { n: 0, l: 0, cap, x: o.x, y: o.y, m: [] }; c.bk.push(k); }
  k.n++; k.m.push(o);
  o.bk = k;
  o.m |= M_TGT;
}

// --- archetypes ------------------------------------------------------------
function pegField(c) {
  const rows = ri(4, 6), gap = c.h / (rows + 1);
  for (let r = 0; r < rows; r++) {
    const yy = c.y + gap * (r + 1), n = ri(4, 7);
    for (let i = 0; i < n; i++) {
      const t = (i + (r & 1 ? .5 : 0)) / (n - .34);
      c.o.push(ci(bL + 40 + t * (bW - 90), yy, rf(14, 30),
        mat(bB, 0) | (rp(.45) ? M_BUMP : rp(.25) ? M_TGT : 0), moving(bB, 60)));
      if (c.o[c.o.length - 1].m & M_TGT) tag(c, c.o[c.o.length - 1], 3);
    }
  }
}

// One builder covers both the Funnel and the Sieve: a wall across the column
// with n openings. `drop` slopes the outer ends up and the gap edges down,
// which turns a flat sieve into a converging funnel.
function barrier(c, n, drop, yy, quiet, mo) {
  const m = mo || mat(bB, 1), cuts = [];
  for (let i = 0; i < n; i++) cuts.push(bL + (i + rf(.22, .8)) * bW / n);
  let px = bL - 20, py = yy - drop;
  for (let i = 0; i <= n; i++) {
    const last = i == n;
    const gw = mx(100, rf(120, 200) - bD * 16);
    const nx = last ? bR + 20 : cuts[i] - gw / 2, ny = last ? yy - drop : yy + drop;
    if (nx - px > 26) c.o.push(sgAB(px, py, nx, ny, m));
    if (!last && drop > 40 && rp(.6)) c.o.push(ci(nx, ny, 15, M_BUMP));
    px = last ? nx : cuts[i] + gw / 2;
    py = yy + drop;
  }
  if (quiet) return cuts;
  // Coins below the easiest gap, the prize above the least convenient one.
  for (let i = 0; i < 4; i++) c.i.push(item(I_COIN, cuts[0] + rf(-26, 26), yy + drop + 70 + i * 48));
  c.i.push(item(rp(.34) ? I_PIG : I_CROWN, cuts[n - 1], yy - drop - 70, pick(aff(c.rg))));
  return cuts;
}

function bowl(c) {
  const r = mn(bW * .4, 300), bx = bX + rf(-.2, .2) * bW, by = c.y + c.h * .6;
  const rim = r * cos(.12 * PI);
  arcSegs(c, bx, by, r, .12 * PI, .8 * PI, rp(.34) ? M_DAMP : 0);
  c.o.push(ci(bx - rim, by, 15, M_BUMP), ci(bx + rim, by, 15, M_BUMP));
  // Something worth the risk of dropping in.
  c.i.push(item(rp(.3) ? I_CROWN : I_PIG, bx, by + r * .5, pick(aff(c.rg))));
  if (rp(.6)) c.o.push(sg(bx, c.y + c.h * .18, rf(60, 120), rf(-.4, .4), M_BUMP, moving(bB, 90)));
}

function shaft(c) {
  const w = mx(150, 240 - bD * 30), sx = bX + rf(-.2, .2) * bW;
  const drift = rf(-90, 90);
  c.o.push(sgAB(sx - w / 2, c.y, sx - w / 2 + drift, c.y + c.h, M_RAIL));
  c.o.push(sgAB(sx + w / 2, c.y, sx + w / 2 + drift, c.y + c.h, M_RAIL));
  for (let i = 0; i < 7; i++) c.i.push(item(I_COIN, sx + drift * (i / 7) + rf(-30, 30), c.y + 80 + i * (c.h - 150) / 6));
  // Outside the shaft: an optional pocket the player has to leave the rail for.
  if (rp(.6)) {
    const ox = sx < bX ? bR - 70 : bL + 70;
    const bp = rp(.5);
    c.i.push(item(bp ? I_PIG : I_BOOST, ox, c.y + c.h * .5, bp ? pick(aff(c.rg)) : ri(0, 6)));
  }
}

function rotor(c) {
  const n = ri(1, 2);
  for (let i = 0; i < n; i++) {
    const rx = bX + rf(-.22, .22) * bW, ry = c.y + c.h * (n == 1 ? .5 : .3 + i * .4);
    const arms = ri(2, 3), len = mn(bW * .3, 200), w = rs() * rf(.9, 1.9 + bD * .3);
    for (let a = 0; a < arms; a++)
      c.o.push(sg(rx, ry, len, a * PI / arms, M_BUMP, { w }));
    c.o.push(ci(rx, ry, 18, 0));
    c.i.push(item(I_COIN, rx, ry - len - 40), item(I_COIN, rx, ry + len + 40));
  }
}

function chamber(c) {
  const top = c.y + c.h * .16, bot = c.y + c.h * .8;
  barrier(c, 1, 0, top, 1);
  barrier(c, 1, 0, bot, 1);
  const n = ri(4, 7);
  for (let i = 0; i < n; i++) {
    const ix = bL + rf(.12, .8) * bW, iy = lerp(top + 60, bot - 60, rr());
    if (solidNear(c, ix, iy, 60)) continue;
    if (rp(.5)) c.o.push(ci(ix, iy, rf(16, 30), rp(.5) ? M_BUMP : M_ANCH, moving(bB, 80)));
    else c.o.push(sg(ix, iy, rf(48, 90), rf(0, PI), mat(bB, 1) | (rp(.3) ? M_RAIL : 0), moving(bB, 70)));
  }
  // A ring of orbit fodder around the middle: this is the archetype the Green
  // tether and the Yellow spring are meant to be used in.
  const mx2 = bX, my = (top + bot) / 2, rr2 = mn(bW * .3, 200);
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + rf(0, 1), ix = mx2 + cos(a) * rr2, iy = my + sin(a) * rr2 * .7;
    if (!solidNear(c, ix, iy, 60)) c.o.push(ci(ix, iy, rf(13, 20), M_BUMP, moving(bB, 60)));
  }
  // Side pocket with the good stuff
  c.i.push(item(rp(.22) ? I_CROWN : I_PIG, rp(.5) ? bL + 60 : bR - 60, (top + bot) / 2, pick(aff(c.rg))));
}

// Drop-target banks: rows of lit-on-contact panels flanked by kickers. Clear a
// whole bank and it pays out and re-arms, which is the loop that makes a
// pinball table worth staying on rather than falling through.
function targets(c) {
  const rows = ri(2, 3);
  for (let r = 0; r < rows; r++) {
    const yy = c.y + c.h * (.2 + r * .6 / rows + rf(-.04, .04));
    const n = ri(3, 5), span = mn(bW * .8, 300), x0 = bX - span / 2 + rf(-40, 40);
    const k = { n, l: 0, cap: n, x: bX, y: yy, m: [] };
    c.bk.push(k);
    for (let i = 0; i < n; i++) {
      const o = sg(x0 + (i + .5) * span / n, yy, 30, PI / 2 + rf(-.2, .2), M_TGT);
      o.bk = k; k.m.push(o);
      c.o.push(o);
    }
    // Kickers at both ends of the bank keep the ball in the lane.
    c.o.push(ci(x0 - 40, yy, 20, M_BUMP), ci(x0 + span + 40, yy, 20, M_BUMP));
    for (let i = 0; i < n; i++) c.i.push(item(I_COIN, x0 + (i + .5) * span / n, yy - 60));
  }
  c.i.push(item(rp(.4) ? I_BOOST : I_PIG, bX + rf(-.3, .3) * bW, c.y + c.h * .92, ri(0, 6)));
}

// Crusher lane: a corridor of breakable panels with counter-swinging arms that
// do the demolition for you once you are moving. Sunforge's signature room.
// Crusher lane: a corridor of breakable curtains, each with one deliberate gap
// and a heavy arm sweeping it. Sunforge's signature room.
//
// The curtain IS a barrier with its material forced breakable -- the same
// builder the Funnel and the Sieve use -- so all this has to do is ask barrier
// where it left the gap and put the arm and the bait there.
function crushers(c) {
  const n = ri(3, 4);
  for (let i = 0; i < n; i++) {
    const yy = c.y + c.h * (.15 + i * .8 / n);
    const gx = barrier(c, 1, 0, yy, 1, M_BREAK)[0];
    c.o.push(sg(gx, yy + c.h * .4 / n, mn(bW * .3, 150), rf(0, PI), M_BUMP,
      { w: rs() * rf(.8, 1.6 + bD * .4) }));
    c.i.push(item(I_COIN, gx, yy + 40), item(I_COIN, gx + rf(-30, 30), yy + 90));
  }
  c.i.push(item(rp(.5) ? I_CROWN : I_BOOST, bX, c.y + c.h * .96, ri(0, 6)));
}

// --- special rooms ---------------------------------------------------------
function buildGate(c) {
  const cx = bX, cy = c.y + c.h * .4;
  rotor(c);
  barrier(c, 1, 0, cy + 300, 1);
  c.o.push(ci(cx, cy, 26, M_BUMP));
  for (let i = 0; i < 7; i++) c.i.push(item(I_PIG, cx + (i - 3) * 70, cy + 420, i));
  c.i.push(item(I_CROWN, cx, c.y + 150));
}

// --- rewards ---------------------------------------------------------------
function rewards(c, rg) {
  const af = aff(rg);
  // Reward density tracks the region's own density number, so the Prism Mine
  // really is worth the risk it asks you to take and Cloudbreak stays airy.
  const rich = REG[rg][6] / 6;
  // Drop something valuable in the first free spot we find.
  const place = (t, cc, lo, hi) => {
    for (let a = 0; a < 10; a++) {
      const x = rf(bL + 40, bR - 40), y = c.y + rf(lo, hi) * c.h;
      if (!solidNear(c, x, y, 30)) { c.i.push(item(t, x, y, cc)); return; }
    }
  };
  // A coin arc that teaches a trajectory.
  if (rp(.8)) {
    const n = ri(5, 9), x0 = bL + rf(.1, .5) * bW, y0 = c.y + rf(.16, .5) * c.h;
    const d = rs() * rf(150, 300), rise = rf(-200, 240);
    for (let i = 0; i < n; i++) {
      const t = i / n;
      const x = x0 + d * t, y = y0 + rise * sin(t * PI) + t * 150;
      if (x > bL + 26 && x < bR - 26 && !solidNear(c, x, y, 26)) c.i.push(item(I_COIN, x, y));
    }
  }
  // Pigment biased to the region affinity, but never exclusive to it.
  if (rp(.6 * rich)) place(I_PIG, rp(.7) ? pick(af) : ri(0, 6), .16, .8);
  // Upward temptation, above the entry line.
  if (rp(.3 * rich)) place(rp(.3) ? I_BOOST : I_CROWN, ri(0, 6), .02, .16);
  if (rp(.16 * rich)) place(I_BOOST, ri(0, 6), .3, .8);
  // The Prism Well is the game's only full refill. It used to be locked inside
  // a Focus Vault; with those gone it becomes a rare find in its own right,
  // still rare enough that hitting one feels like luck rather than supply.
  if (rp(.07 * rich)) place(I_WELL, 0, .2, .8);

}

// --- lifecycle -------------------------------------------------------------
function worldReset(sd) {
  seed = sd || (rnd() * 1e9) | 0;
  srnd(seed);
  chunks = []; nextY = -900; prevL = -COL; prevR = COL; cIdx = 0;
  // Opening room: open, gentle, and it demonstrates bouncing within seconds.
  const c = mkChunk(-900, 1400, -COL, COL, -COL, COL);
  c.o.push(sgAB(-COL, -900, -COL, 500, 0), sgAB(COL, -900, COL, 500, 0),
    sgAB(-COL, -900, COL, -900, M_BUMP),
    ci(-150, 60, 26, M_BUMP), ci(150, 240, 26, M_BUMP), ci(-60, 420, 20, M_BUMP));
  for (let i = 0; i < 7; i++) c.i.push(item(I_COIN, -200 + i * 70, 150 + sin(i * .9) * 90));
  c.i.push(item(I_PIG, 240, -60, 1), item(I_PIG, -240, 420, 2));
  chunks.push(c);
  nextY = 500;
  while (nextY < 3000) genChunk();
}

function worldUpdate() {
  while (nextY < P.y + 3200) genChunk();
  // Ceiling guard: never let the unicorn leave the retained world upward.
  const top = chunks[0];
  if (P.y < top.y + 40) { P.y = top.y + 40; if (P.vy < 0) P.vy = abs(P.vy) * .6; }
}

// --- column bounds ---------------------------------------------------------
// The shaft walls are chunk-to-chunk segments, so the playable span at a given
// height is an interpolation between the chunk's entry and exit walls. Warps,
// portals and Indigo can all put the unicorn somewhere arbitrary, and relying
// on segment collision alone let it end up behind a wall with nothing to push
// it back. Results land in scratch globals to keep the physics step allocation
// free.
let _wl = -WMAX, _wr = WMAX;
function wallsAt(y) {
  _wl = -WMAX; _wr = WMAX;
  for (const c of chunks) if (y >= c.y && y < c.y + c.h) {
    const t = (y - c.y) / c.h;
    _wl = lerp(c.pl, c.l, t); _wr = lerp(c.pr, c.r, t);
    return;
  }
}

// The force a chunk's field applies at (x,y), into the scratch pair _zx/_zy.
// One switch, five fields, and every region gets a mechanic instead of a
// repaint. Fields never kill: the worst any of them does is redirect you.
let _zx = 0, _zy = 0;
function zoneF(c, x, y) {
  _zx = _zy = 0;
  const z = c.z;
  if (!z) return;
  const t = (y - c.y) / c.h, ph = sin(t * 7 + T * 1.4);
  if (z == Z_UP) {
    // Updraft columns: three lanes of lift you can ride or dodge.
    const lane = cos((x - c.l) / (c.r - c.l) * TAU * 1.6);
    if (lane > .1) _zy = -GRAV * 1.2 * lane;
  } else if (z == Z_WELL) {
    // A gravity well at the chunk's heart, falling off with distance.
    const dx = (c.l + c.r) / 2 - x, dy = c.y + c.h * .5 - y, d = hyp(dx, dy) + 60;
    const k = mn(1, 300 / d) * GRAV * .8;
    _zx = dx / d * k; _zy = dy / d * k;
  } else if (z == Z_WIND) {
    _zx = ph * GRAV * .6;
  } else if (z == Z_INV) {
    // Inversion: the shaft is upside down here, and the transition is soft
    // enough at the edges that you always see it coming.
    _zy = -GRAV * 2 * clamp(mn(t, 1 - t) * 6, 0, 1);
  } else if (z == Z_FLOW) {
    // The Coil: a rotation about the chunk's heart. Everything in Verdant is
    // built to be swung around, and the field swings you too.
    const cx = (c.l + c.r) / 2, cy = c.y + c.h * .5;
    const dx = x - cx, dy = y - cy, d = hyp(dx, dy) + 80;
    const k = GRAV * .7 * mn(1, 300 / d);
    _zx = -dy / d * k; _zy = dx / d * k;
  } else {
    // The Current: a meandering channel that carries you down it. Unlike the
    // Coil this one has a direction, which is what makes the Crystal region a
    // race rather than a playground.
    const cx = (c.l + c.r) / 2 + sin(y * .0016 + c.y * .01) * (c.r - c.l) * .3;
    _zx = clamp((cx - x) * 5, -GRAV, GRAV);
    _zy = GRAV * .5;
  }
}

// Chunks overlapping a vertical span (used by physics + render).
function nearChunks(y0, y1) {
  const out = [];
  for (const c of chunks) if (c.y + c.h > y0 && c.y < y1) out.push(c);
  return out;
}

// ==== audio.js ====
// ---------------------------------------------------------------------------
// Procedural Web Audio. Everything is synthesised from two primitives:
//   O() - an oscillator with a pitch sweep and an AD envelope
//   N() - a slice of the shared noise buffer through a swept filter
// The rail grind is a single continuous voice created once and only modulated,
// so long runs never accumulate nodes.
// ---------------------------------------------------------------------------

let AC = null, mg, sfxG, musG, lpF, nzBuf, railG, railO, railF;
let voices = 0;                   // per-frame voice budget
let mNext = 0, mStep = 0;         // music scheduler

const NOTE = (n) => 420 * M.pow(2, (n - 70) / 12);
const SCALE = [[0, 2, 3, 5, 7, 8, 10], [0, 2, 4, 5, 7, 9, 11], [0, 3, 5, 7, 10, 12], [0, 1, 5, 6, 8, 11]];
const WAVE = ['triangle', 'sawtooth', 'square'];

function audioInit() {
  if (AC) { if (AC.state == 'suspended') AC.resume(); return; }
  if (!window.AudioContext) return;
  AC = new AudioContext();

  lpF = AC.createBiquadFilter(); lpF.type = 'lowpass'; lpF.frequency.value = 20000;
  mg = AC.createGain(); mg.gain.value = SAVE.m ? 0 : .8;
  lpF.connect(mg).connect(AC.destination);
  sfxG = AC.createGain(); sfxG.gain.value = .8; sfxG.connect(lpF);
  musG = AC.createGain(); musG.gain.value = .5; musG.connect(lpF);

  const n = AC.sampleRate * 2;
  nzBuf = AC.createBuffer(1, n, AC.sampleRate);
  const d = nzBuf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = rnd() * 2 - 1;

  // One always-on voice: the Blue rail grind. Built once, then only its gain
  // and frequency are modulated, so long runs never leak nodes.
  //
  // There was a second continuous voice here -- a speed-driven wind bed. Even
  // heavily damped it was fatiguing over a run, because it is on whenever you
  // are moving and you are almost always moving. Speed already reads through
  // the camera, the trail, the impacts and the music intensity, so the noise
  // bed was carrying no information anyone needed.
  railO = AC.createOscillator(); railO.type = 'sawtooth'; railO.frequency.value = 200;
  railF = AC.createBiquadFilter(); railF.type = 'bandpass';
  railF.frequency.value = 1400; railF.Q.value = 6;
  railG = AC.createGain(); railG.gain.value = 0;
  railO.connect(railF).connect(railG).connect(sfxG);
  railO.start();

  mNext = AC.currentTime + .1;
}

// Guards every synthesised voice: no context, muted, or over the frame budget.
const ok = () => AC && !SAVE.m && voices < 26;
const now = () => AC.currentTime;

// Oscillator with an optional pitch sweep and an attack/decay envelope.
// f1 of 0 (or equal to f0) means "hold the pitch".
// Pitch (or cutoff) sweep shared by both voices: hold f0, glide to f1 if given.
function sweep(p, f0, f1, t, dur, lo) {
  p.setValueAtTime(mx(lo, f0), t);
  if (f1 && f1 != f0) p.exponentialRampToValueAtTime(mx(lo, f1), t + dur);
}
// Envelope and routing shared by both voices: src (through mid) -> gain -> dest.
// `att` is each voice's own attack time; the two are not the same sound.
function fire(src, mid, t, dur, pk, dest, att) {
  const g = AC.createGain();
  g.gain.setValueAtTime(1e-4, t);
  g.gain.exponentialRampToValueAtTime(mx(1e-4, pk), t + att);
  g.gain.exponentialRampToValueAtTime(1e-4, t + dur);
  (mid ? src.connect(mid) : src).connect(g).connect(dest || sfxG);
  src.start(t); src.stop(t + dur + .02);
  voices++;
}
function O(w, f0, f1, dur, pk, dest, t0) {
  if (!ok()) return;
  const t = t0 || now();
  const o = AC.createOscillator();
  o.type = w;
  sweep(o.frequency, f0, f1, t, dur, 8);
  fire(o, 0, t, dur, pk, dest, .008);
}

function N(dur, pk, ft, f0, f1, q, dest, t0) {
  if (!ok()) return;
  const t = t0 || now();
  const s = AC.createBufferSource();
  s.buffer = nzBuf; s.loop = true;
  s.playbackRate.value = .7 + rnd() * .6;
  const f = AC.createBiquadFilter(); f.type = ft;
  sweep(f.frequency, f0, f1, t, dur, 20);
  f.Q.value = q || 1;
  fire(s, f, t, dur, pk, dest, .005);
}

// --- collision / material --------------------------------------------------
// Impact: one noise transient scaled by impulse, plus a body tone. kind 1 is a
// dampener (dull thud), kind 2 a bumper (bright ping).
function sndHit(imp, kind, tune) {
  if (imp < 60) return;
  const v = clamp(imp / 2400, .04, .5);
  N(.03 + v * .12, v * .7, 'lowpass', 300 + imp * 1.6, 150, 1);
  if (imp > 420) O('triangle', 120 + imp * .05, 40, .1 + v * .12, v * .8);
  if (kind > 1) {
    // The Organ: every bumper is tuned by its own position, in the current
    // region's mode, so a column of them plays a phrase as you fall through it.
    const sc = SCALE[reg % 4], q = abs(tune | 0);
    const n = 64 + sc[(q >> 5) % sc.length] + 12 * (q >> 9 & 1);
    O('sine', NOTE(n), NOTE(n) * 1.6, .16, v * .5);
    O('triangle', NOTE(n + 12), 0, .1, v * .3);
  } else if (kind) O('sine', 90, 40, .22, v * .5);
}

// Depth is the cascade generation: each ring of a chain reaction rings a
// little higher and a little thinner, so a collapse sounds like one event
// spreading outward instead of six identical crashes on the same frame.
function sndBreak(d) {
  const k = 1 / (1 + d * .5);
  N(.3 * k, .5 * k, 'bandpass', 2600 * (1 + d * .3), 300, 1.4);
  O('triangle', 150 * (1 + d * .2), 40, .3 * k, .5 * k);
  N(.1, .3 * k, 'highpass', 4369, 9000, 1);
}

// A scoring target: pitch climbs with how much of the bank is already lit, so
// you can hear how close a bank is without reading the pips.
// --- cues that borrow -------------------------------------------------------
// Seven rare events reuse a sound that already exists rather than carrying one
// of their own. Every one still fires, still lands on the right beat, and still
// carries its information in PITCH -- the part a player actually reads. A
// target still climbs as its bank fills and pigment still pitches by colour,
// because the sound they borrow is itself pitch-driven.
//
// What they give up is a timbre of their own, and they are the seven nobody
// could describe from memory. The signature sounds -- impact, destruction, the
// seven colour verbs, the coin, the crown, the bank, death, Full Spectrum --
// are untouched.
function sndTarget(f) { sndCoin(f * 8); }
function sndBank() {
  ARP(70, [0, 4, 7, 12, 16, 19], .5, .12, 'square', .04, 12);
  N(.7, .22, 'bandpass', 700, 6000, .8);
  O('sine', 90, 300, .4, .3);
}

// --- the seven colours -----------------------------------------------------
function sndBoost(ns) {                       // Red - rocket
  const v = clamp(ns / 2600, .16, .5);
  O('sawtooth', 150, 700 + ns * .2, .2, v * .5);
  N(.3, v * .7, 'bandpass', 700, 4369, 1.2);
  O('sine', 70, 30, .3, v * .8);
}
function sndVector(sup) {                     // Orange - directional snap
  O('square', sup ? 700 : 900, sup ? 1800 : 1500, .07, .16);
  N(.05, .12, 'highpass', 2600, 5200, 1);
  if (sup) O('sine', 300, 900, .16, .2);
}
function sndSpring(imp) {                     // Yellow - elastic boing
  const v = clamp(imp / 1400, .12, .4);
  O('sine', 180 + imp * .1, 700 + imp * .3, .1, v);
  O('sine', 700 + imp * .3, 200, .2, v * .8);
}
function sndTether(on) {                      // Green - tension / thwip
  if (on) { O('triangle', 240, 700, 1.2, .12); N(.06, .1, 'bandpass', 900, 2600, 3); }
  else { O('sawtooth', 900, 200, .12, .25); N(.1, .2, 'bandpass', 1800, 500, 2); }
}
function sndRail(on) {                        // Blue - continuous grind
  if (!AC) return;
  if (railG) railG.gain.setTargetAtTime(on && !SAVE.m ? .12 : 0, now(), .03);
  if (on) O('square', 1200, 2600, .05, .1);
}
function sndGrav(ny) {                        // Indigo - gravity whoop
  const up = ny < 0;
  O('sine', up ? 120 : 420, up ? 420 : 100, .5, .3);
  O('triangle', up ? 240 : 700, up ? 700 : 200, .4, .12);
  N(.4, .1, 'lowpass', 900, 200, 1);
}
function sndWarp() {                          // Violet - space
  O('sawtooth', 2600, 240, .1, .2);
  N(.085, .16, 'highpass', 7000, 1400, 2);
  O('sine', 90, 240, .2, .25);
}

// --- rewards / systems -----------------------------------------------------
function sndCoin(cmb) {
  const n = 70 + mn(cmb, 14) * 2;
  O('square', NOTE(n), 0, .06, .1);
  O('sine', NOTE(n + 12), 0, .1, .12);
}
// One arpeggio/chord engine drives every musical reward cue.
// offs = semitone offsets, gap = seconds between notes (0 = chord), up = glide.
function ARP(root, offs, dur, pk, w, gap, up) {
  if (!AC) return;
  const t = now();
  offs.forEach((o, i) => O(w, NOTE(root + o), up ? NOTE(root + o + up) : 0, dur, pk, 0, t + i * gap));
}
const MAJ = [0, 4, 7, 12];
function sndCrown() { ARP(70, MAJ, .5, .12, 'triangle', .05); }
function sndPig(c) { sndCoin(c); }
function sndWell() { sndCrown(); }
function sndSpectrum() {
  ARP(60, SCALE[1], .7, .12, 'sawtooth', .05, 12);
  ARP(90, MAJ, 1.6, .1, 'sine', 0);
  if (AC) N(1.2, .2, 'bandpass', 420, 8000, .7, 0, now() + .3);
}
function sndFuse() { sndUI(1); }
function sndRefund() { sndCoin(0); }
function sndPower() { ARP(60, [0, 5, 10], .12, .1, 'square', .06, 2); }
function sndEmpty() { sndUI(0); }
function sndStall(u) { O('sine', 70 + u * 40, 48, .16, .12 + u * .16); }
function sndDeath() {
  ARP(70, [0, -3, -6, -9, -12, -15, -18], .8, .1, 'sawtooth', .04, -30);
  N(1, .3, 'lowpass', 3000, 90, 1);
  O('sine', 120, 30, 1.2, .3);
}
function sndUI(up) { O('square', up ? 900 : 620, up ? 1200 : 500, .04, .07); }
function sndGate() { sndBank(); }

// --- per-frame continuous layers ------------------------------------------
// Continuous layers, updated once a frame:
//  - the rail grind tracks rail speed
//  - one master low-pass ducks everything inside a Focus Vault or a pause
function audioFrame() {
  voices = 0;
  if (!AC) return;
  const t = now(), n = clamp(P.sp / VMAX, 0, 1), play = st == 1 && P.al;
  const set = (p, v, k) => p.setTargetAtTime(v, t, k);
  set(railG.gain, P.ra && !SAVE.m && play ? .1 + n * .12 : 0, .04);
  set(railF.frequency, 700 + P.sp * 1.4, .04);
  set(railO.frequency, 90 + P.sp * .2, .04);
  set(lpF.frequency, st == 2 ? 700 : 20000, .1);
  set(musG.gain, SAVE.m ? 0 : st == 1 ? .5 : .3, .2);
  if (play) musicTick();
  else mNext = t + .1;
}

// A 16th-note scheduler that plays a real, if small, arrangement: kick, bass,
// a sustained chord pad, hats and a lead. Region identity is a formula rather
// than seven hand-written tracks -- root, mode, timbre, tempo and the bass
// rhythm all key off the region index -- and density follows how fast you are
// going, so the music reacts to the run instead of looping underneath it.
// Rhythm masks: one bit per 16th note of the bar, LSB first.
//   Cloudbreak four-on-the-floor - Sunforge driving - Verdant loose -
//   Crystal clean - Mine sparse and heavy - Temple off-kilter - Engine eighths
const KICK = [0x1111, 0x1155, 0x1013, 0x1111, 0x1001, 0x0512, 0x5555];
const BASSR = [0x8889, 0xa4a5, 0x9192, 0xcccd, 0x8484, 0xa8a9, 0xaaab];

function musicTick() {
  const root = 40 + reg * 5 % 11, sc = SCALE[reg % 4], w = WAVE[reg % 3];
  const inten = clamp(P.sp / VFAST, 0, 1.6) + (fullSpec > 0 ? .6 : 0);
  const spb = 15 / (90 + reg * 7);
  const kick = KICK[reg], bassr = BASSR[reg];
  const t0 = now();
  for (let guard = 8; mNext < t0 + .16 && guard--;) {
    const t = mx(mNext, t0), i = mStep, b = i & 15, bar = i >> 4;
    const deg = (bar * 2 + (b > 7 ? 1 : 0)) % sc.length;
    const bass = root - 12 + sc[deg];

    if (kick >> b & 1) { O('sine', 120, 40, .16, .5, musG, t); N(.03, .12, 'lowpass', 900, 200, 1, musG, t); }
    if (bassr >> b & 1) O(w, NOTE(bass), 0, .2, .3, musG, t);
    // Pad: a held triad at the top of every bar, which is what actually makes
    // a region sound like a place rather than a drum loop.
    if (!b) for (const o of [0, 3 + (sc[2] > 3 ? 1 : 0), 7])
      O('triangle', NOTE(root + sc[deg] + o), 0, spb * 15, .1, musG, t);
    if (inten > .22 && (b & 1)) N(.03, .04 + inten * .03, 'highpass', 7000, 6000, 1, musG, t);
    if (inten > .5 && b % 4 == 2) N(.1, .12, 'bandpass', 1800, 900, 1.2, musG, t);
    if (inten > .8 && !(b & 1)) {
      const n = NOTE(root + 12 + sc[(i * 3 + bar) % sc.length]);
      O(w, n, n, .1, .1, musG, t);
    }
    mStep++; mNext = t + spb;
  }
}

// ==== util.js ====
// ---------------------------------------------------------------------------
// Math helpers + the deterministic PRNG used by every generator.
// ---------------------------------------------------------------------------

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
// Frame-rate independent exponential approach.
const approach = (a, b, r, h) => lerp(a, b, 1 - M.exp(-r * h));

// mulberry32 - 3 lines, good enough, fully seedable for regression replays.
let _rs = 1;
function srnd(s) { _rs = s >>> 0; }
// mulberry32's output stage, on its own so hsh() can hash through it too.
function mix(s) {
  let t = M.imul(s ^ (s >>> 15), 1 | s);
  t = (t + M.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rr() { return mix(_rs = (_rs + 0x6d2b79f5) | 0); }
const rf = (a, b) => a + rr() * (b - a);
const ri = (a, b) => flr(a + rr() * (b - a + 1));
const rp = (p) => rr() < p;
const pick = (a) => a[flr(rr() * a.length)];
// Random sign.
const rs = () => (rr() < .5 ? -1 : 1);

// Stateless hash for background motifs - infinite scenery with zero storage.
function hsh(x, y) { return mix(x * 1000003 + y | 0); }

// Closest point on segment (ax,ay)-(bx,by) to (px,py). Returns param 0..1.
function segT(ax, ay, bx, by, px, py) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  return l ? clamp(((px - ax) * dx + (py - ay) * dy) / l, 0, 1) : 0;
}

// Segment/segment intersection point, or null. Used for Prism Node fusion.
function segX(ax, ay, bx, by, cx, cy, dx, dy) {
  const r1 = bx - ax, r2 = by - ay, s1 = dx - cx, s2 = dy - cy;
  const d = r1 * s2 - r2 * s1;
  if (!d) return null;
  const t = ((cx - ax) * s2 - (cy - ay) * s1) / d;
  const u = ((cx - ax) * r2 - (cy - ay) * r1) / d;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1 ? [ax + r1 * t, ay + r2 * t] : null;
}

// hsl helpers - every colour in the game comes from these two.
const hsl = (h, s, l, a) => 'hsl(' + h + ' ' + s + '% ' + l + '%' + (a == undefined ? '' : ' / ' + a) + ')';
const chsl = (c, l, a) => hsl(HUE[c], 100, l, a);

// ==== render.js ====
// ---------------------------------------------------------------------------
// Rendering: camera, region backdrops, world geometry, the procedural unicorn,
// trail and particles. Everything is Canvas2D primitives - no assets.
//
// Written for compressed size: one set of drawing shorthands, one particle
// spawner, one polygon helper, and region identity carried by parameters
// rather than by separate code paths.
// ---------------------------------------------------------------------------

const BP = () => X.beginPath();
const SK = (w, c) => { X.lineWidth = w; X.strokeStyle = c; X.stroke(); };
const FL = (c) => { X.fillStyle = c; X.fill(); };
const AR = (x, y, r, a, b) => X.arc(x, y, r, a || 0, b == undefined ? TAU : b);
const MT = (x, y) => X.moveTo(x, y);
const LT = (x, y) => X.lineTo(x, y);
const LIN = (ax, ay, bx, by, w, c) => { BP(); MT(ax, ay); LT(bx, by); SK(w, c); };
const CIR = (x, y, r, f, s, w) => { BP(); AR(x, y, r); if (f) FL(f); if (s) SK(w, s); };
// Closed polygon; fn(i) plots vertex i through VTX.
const POLY = (n, f, s, w, fn) => {
  BP();
  for (let i = 0; i < n; i++) fn(i);
  X.closePath();
  if (f) FL(f);
  if (s) SK(w, s);
};
const VTX = (i, x, y) => (i ? LT : MT)(x, y);
// Line width in screen pixels, never thinner than one.
const lw = (k) => mx(1, k * SC);

let pal = [232, 62, 12, 322, 52, 27, 288, 80];   // live (interpolated) palette
let shX = 0, shY = 0;

// --- particles -------------------------------------------------------------
// k: 0 spark (streak), 1 debris, 2 ring. hue undefined = current colour.
function shock(x, y, R, h) {
  if (shocks.length > 26) shocks.shift();
  shocks.push({ x, y, r: 0, R, h, t: 1 });
}
function pt(x, y, vx, vy, l, h, k, s) {
  if (parts.length > 420) parts.shift();
  parts.push({ x, y, vx, vy, l, L: l, h, k, s, a: rf(0, TAU), w: rf(-9, 9) });
}
function burst(x, y, n, k, spd, hue, vx, vy) {
  const h = hue == undefined ? HUE[sel] : hue;
  // k==1 is a generic world impact - the equipped Impact cosmetic restyles it.
  const kk = WD && k == 1 ? SAVE.e[3] : k;
  for (let i = 0; i < n; i++) {
    const a = rf(0, TAU), v = rf(.3, 1) * spd;
    pt(x, y, (vx || 0) + cos(a) * v, (vy || 0) + sin(a) * v,
      rf(.16, .5), h + rf(-18, 18), kk, rf(1.4, 3.6));
  }
}
function warpFX(x, y) {
  pt(x, y, 0, 0, .4, HUE[6], 2, 8);
  burst(x, y, 12, 0, 300, HUE[6]);
}
function strokeFX(s, px, py) {
  for (let i = 0; i < 7; i++) if (s.e & CBIT[i]) burst(px, py, 5, 0, 240, HUE[i]);
  pt(px, py, 0, 0, .3, HUE[s.c], 2, 6);
}
function pop(x, y, t, h) { pops.push({ x, y, t, h, l: 1.15 }); }

function partStep(h) {
  for (let i = parts.length; i--;) {
    const p = parts[i];
    if ((p.l -= h) <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * h; p.y += p.vy * h;
    if (p.k != 2) { p.vy += 420 * h; p.vx *= .985; p.vy *= .985; }
    if (p.k == 4) p.a += p.w * h;
  }
  for (let i = shocks.length; i--;) {
    const w = shocks[i];
    w.r += (w.R - w.r) * mn(1, 9 * h);
    if ((w.t -= h * 2.4) <= 0) shocks.splice(i, 1);
  }
  for (let i = pops.length; i--;) {
    const p = pops[i]; p.y -= 48 * h;
    if ((p.l -= h) <= 0) pops.splice(i, 1);
  }
  for (let i = nodes.length; i--;) if ((nodes[i].t -= h) <= 0) nodes.splice(i, 1);
}

// --- camera ----------------------------------------------------------------
function camUpdate(h) {
  C.x = approach(C.x, P.x + clamp(P.vx * .12, -180, 180), 7.5, h);
  C.y = approach(C.y, P.y + clamp(P.vy * .22, -.2 * VH, .22 * VH), 7.5, h);
  C.z = approach(C.z, 1 / (1 + P.sp / 5200), 4, h);
  SC = mn(H / VH, W / (COL * 2 + 48)) * C.z;
  // Keep the play column framed. Without this the velocity lead walks the
  // camera off the side of the world and half the screen becomes dead rock.
  const lim = mx(0, WMAX + 60 - W / 2 / SC);
  C.x = clamp(C.x, -lim, lim);
  shake = mx(0, shake - shake * 7 * h - 4 * h);
  const s = mn(shake, 26);
  shX = rf(-s, s); shY = rf(-s, s);
}
const w2sx = (x) => W / 2 + (x - C.x) * SC + shX;
const w2sy = (y) => H / 2 + (y - C.y) * SC + shY;
const s2wx = (x) => C.x + (x - W / 2 - shX) / SC;
const s2wy = (y) => C.y + (y - H / 2 - shY) / SC;

// Shortest-path hue interpolation so palettes cross-fade instead of spinning.
const alerp = (a, b, r, h) => (a + (((b - a + 540) % 360) - 180) * (1 - M.exp(-r * h)) + 360) % 360;

// Target palette: [bgTopH, bgTopS, bgTopL, bgBotH, bgBotS, bgBotL, geoH, geoL]
//
// Geometry carries its own hue rather than a function of the sky's. Deriving it
// as the sky's complement did guarantee contrast, but it also landed four of
// the seven regions inside the same gold band, so half the game's obstacles
// looked alike however different the backdrop was. The table's values are each
// at least 90 degrees from their own background's midpoint and at least 35 from
// every other region's. The Rainbow Engine's is -1, meaning it cycles -- which
// is the one region that ought to.
const regPal = (r) => {
  const q = REG[r], hu = q[1], sp = q[2], bl = q[4], g = q[9];
  return [hu, 56, bl, hu + sp, 64, bl + 23, g < 0 ? (T * 16) % 360 : g, q[3]];
};
function palUpdate(h) {
  const t = regPal(reg);
  for (let i = 0; i < 8; i++)
    pal[i] = i % 3 || i > 6 ? approach(pal[i], t[i], 1.6, h) : alerp(pal[i], t[i], 1.6, h);
}

// --- background ------------------------------------------------------------
// Two parallax layers of a region motif, placed on an infinite hashed grid so
// the scenery is endless and costs no storage.
function background() {
  const g = X.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, hsl(pal[0] | 0, pal[1] | 0, pal[2] | 0));
  g.addColorStop(1, hsl(pal[3] | 0, pal[4] | 0, pal[5] | 0));
  X.fillStyle = g; X.fillRect(0, 0, W, H);
  const k = MOT[reg];
  X.lineWidth = lw(2.4);
  for (let L = 0; L < 2; L++) {
    const par = L ? .4 : .16, size = L ? 300 : 500, al = L ? .09 : .05;
    const cx = C.x * par, cy = C.y * par, hw = W / 2 / SC, hh = H / 2 / SC;
    const x1 = flr((cx + hw) / size), y1 = flr((cy + hh) / size);
    for (let gy = flr((cy - hh) / size); gy <= y1; gy++)
      for (let gx = flr((cx - hw) / size); gx <= x1; gx++) {
        const v = hsh(gx * 30 + k, gy * 17);
        if (v < .5) continue;
        const wx = (gx + .16 + hsh(gx, gy) * .7) * size, wy = (gy + .16 + hsh(gy, gx + 9) * .7) * size;
        const hue = pal[6] + (v - .5) * 60 | 0;
        X.fillStyle = hsl(hue, 60, pal[7] | 0, al);
        X.strokeStyle = hsl(hue, 70, pal[7] | 0, al * 2);
        motif(k, W / 2 + (wx - cx) * SC, H / 2 + (wy - cy) * SC, size * (.16 + v * .3) * SC, v);
      }
  }
}

// One number per region is the whole motif system: 0 is the cloud, a positive
// n a filled n-gon, a negative n an outlined one. Seven regions, seven
// silhouettes, one shape function.
//
// This replaced three separate primitive families -- blobs, polygons with an
// inner radius and a roughness flag, and rings-plus-spokes with partial-arc
// variants -- driven by a table of three numbers each. That machinery was the
// single most expensive presentation system in the game at 361 archive bytes,
// and four of the seven regions were using the same family as each other
// anyway. Cloudbreak keeps its clouds, because the cloud is the one silhouette
// nothing else can stand in for.
//   Cloudbreak clouds - Sunforge hex ring - Verdant triangle ring -
//   Crystal pentagon - Mine heptagon - Temple octagon ring - Engine square ring
const MOT = [0, -6, -3, 5, 7, -8, -4];

function motif(k, x, y, r, v) {
  BP();
  if (!k) {
    // A cloud is a union of lobes sitting on a flat base. Every lobe MUST open
    // its own subpath: consecutive arcs in one path are joined by a straight
    // line, and those chords are the hard triangular wedges that were showing
    // up inside every cloud in Cloudbreak.
    r *= .6;
    const n = 4 + (v * 4 | 0), base = y + r * .3;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1) - .5;
      // Fattest in the middle, tapering to the ends; the hash keeps every cloud
      // in the field a different shape for free.
      const lr = r * (.3 + .3 * cos(t * 2.4) + hsh(i * 7, v * 420) * .16);
      const lx = x + t * r * 1.6, ly = base - lr * (.8 + hsh(i, v * 90) * .5);
      MT(lx + lr, ly);
      AR(lx, ly, lr);
    }
    // A slab along the bottom closes the gaps between lobes into one silhouette.
    X.roundRect(x - r * .9, base - r * .3, r * 1.9, r * .3, r * .16);
    X.fill();
    return;
  }
  const n = abs(k);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + v * 4;
    VTX(i, x + cos(a) * r, y + sin(a) * r);
  }
  X.closePath();
  if (k > 0) X.fill(); else X.stroke();
}

// --- world -----------------------------------------------------------------
// Material styling: [hue, fillSat, fillLight, edgeSat, edgeLight].
const MSTY = [
  [276, 40, 7, 60, 26],      // damp / void
  [18, 74, 42, 100, 66],     // breakable
  [292, 60, 30, 100, 74],    // phase wall
  [200, 80, 40, 100, 76],    // guide rail
  [140, 70, 34, 100, 70],    // tether anchor
  [46, 38, 22, 90, 60],      // scoring target, unlit
  [46, 100, 60, 100, 92],    // scoring target, lit
];
function obStyle(o) {
  const m = o.m;
  const i = m & M_TGT ? (o.lt ? 6 : 5)
    : m & M_DAMP ? 0 : m & M_BREAK ? 1 : m & M_PHASE ? 2 : m & M_RAIL ? 3 : m & M_ANCH ? 4 : -1;
  if (i < 0) {
    return m & M_BUMP
      ? [hsl(pal[6] + 30 | 0, 90, 48), hsl(pal[6] + 40 | 0, 100, 80)]
      : [hsl(pal[6] | 0, 48, 19), hsl(pal[6] | 0, 90, mx(58, pal[7]) | 0)];
  }
